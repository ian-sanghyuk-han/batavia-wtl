    'thailand','egypt','denmark','malaysia','vietnam','philippines','bangladesh',

    'portugal','new zealand','peru','greece','iraq','qatar','kazakhstan','hungary',
    'kuwait','morocco','ukraine','iran','pakistan','algeria','ethiopia','venezuela',
    'antarctica','greenland']);
  function centroidOf(f){
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    let ring=polys[0][0];
    polys.forEach(p=>{if(p[0].length>ring.length)ring=p[0];});
    const v=new THREE.Vector3();
    ring.forEach(([lo,la])=>v.add(toV3(la,lo,1)));

  const c=document.createElement('canvas');c.width=640;c.height=96;
  const x=c.getContext('2d');
  const size=tier===1?40:tier===2?31:tier===4?28:tier===5?23:24;

  s.renderOrder=20;

  s.scale.set(k,k*96/640,1);return s;}

function relKo(ts){ /* 발행 시각 → "몇 분/시간/일 전" */

/* ══ 국면 자동 테마 (실측 conv → 무대 조명·글로우) ══ */
const REGIMES={
  steady:{en:'STEADY',name:'평온',acc:'#7FD8FF',atm:0x9fc7e0},
  tension:{en:'TENSION',name:'긴장',acc:'#E8A33D',atm:0xE8A33D},

function applyRegime(d){

/* ══ 시장 티커 (실측) — 한국 관례: 상승 적색 · 하락 청색 ══ */
function renderTicker(d){

  const ORDER=['spx','us2y','us10y','dxy','vix','wti','copper','gold','btc','kospi'];

  el.innerHTML=keys.map(k=>s[k]).map(v=>{

    else{chg=v.value-(v.prev??v.value);txt=`${chg>=0?'+':''}${chg.toFixed(2)}%p`;}

/* ══ 파급 엔진 (원장 v0): 진앙 → 발동 카드 → 관측 노드 ══
   판정 재료는 전부 실측 피드(뉴스·시장·국면·등록 이벤트) — 연결 규칙은 v0 추정으로 명시 */
const rippleGroup=new THREE.Group();earth.add(rippleGroup);
const flows=[]; /* {arcs,pulses,gens,ph,group} */
/* 대권(great-circle) 호: 구면을 따라가며 고도를 사인 곡선으로 — 장거리도 지구를 관통하지 않음.
   고도는 거리에 비례 (긴 호일수록 높이 난다). */
function arcCurve(a,b){
  const A=toV3(a[0],a[1],1),B=toV3(b[0],b[1],1);
  const ang=A.angleTo(B);
  const h=.05+.16*(ang/Math.PI);
  const pts=[];
  for(let i=0;i<=32;i++){
    const t=i/32;
    const s=Math.sin((1-t)*ang)/Math.sin(ang),c=Math.sin(t*ang)/Math.sin(ang);
    const p=A.clone().multiplyScalar(s).add(B.clone().multiplyScalar(c)).normalize();
    p.multiplyScalar(R*(1.004+h*Math.sin(Math.PI*t)));
    pts.push(p);}
  return new THREE.CatmullRomCurve3(pts);}
function havKm(a,b){
  const p1=a[0]*D2R,p2=b[0]*D2R,dp=(b[0]-a[0])*D2R,dl=(b[1]-a[1])*D2R;
  const s=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
/* 방사형 파급: spread = 세대 목록 — g세대의 모든 노드가 g+1세대의 모든 노드로 동시에 퍼진다.
   종점 없음, 특정 시장이 주인공이 되지 않음. 맥동은 세대 순서로 캐스케이드. */
function drawFlow(active,idx){
  const col=new THREE.Color(active.card.color);
  let gens=(active.card.spread||[]).map(g=>g.slice());
  if(active.anchor)gens=[[active.anchor],...gens];
  if(gens.length<2)return;
  const group=new THREE.Group();
  const arcs=[]; /* {curve,gen} */
  for(let g=0;g<gens.length-1;g++){
    gens[g].forEach(from=>{gens[g+1].forEach(to=>{
      const cv=arcCurve(from,to);
      arcs.push({curve:cv,gen:g});
      group.add(new THREE.Mesh(new THREE.TubeGeometry(cv,48,.0026,6,false),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.45})));});});}
  const pulses=arcs.map(a=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.0065,8,8),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.95}));
    m.visible=false;group.add(m);
    return {m,arc:a};});
  rippleGroup.add(group);
  flows.push({pulses,nGen:gens.length-1,ph:idx*.37,group});
  active.flow=group;}
/* 상시 관측 동선 — 원장이 늘 지켜보는 통로(옅게, 지면 가까이). 활성 파급(밝음)과 구분 */
function surfaceArc(a,b){
  const A=toV3(a[0],a[1],1),B=toV3(b[0],b[1],1);
  const ang=A.angleTo(B);
  const pts=[];
  for(let i=0;i<=32;i++){
    const t=i/32;
    const s=Math.sin((1-t)*ang)/Math.sin(ang),c2=Math.sin(t*ang)/Math.sin(ang);
    const p=A.clone().multiplyScalar(s).add(B.clone().multiplyScalar(c2)).normalize();
    p.multiplyScalar(R*(1.0035+.012*Math.sin(Math.PI*t)));
    pts.push(p);}
  return new THREE.CatmullRomCurve3(pts);}
function drawRoutes(led){
  (led.routes||[]).forEach(rt=>{
    earth.add(new THREE.Mesh(new THREE.TubeGeometry(surfaceArc(rt.a,rt.b),40,.0016,5,false),
      new THREE.MeshBasicMaterial({color:new THREE.Color(rt.c),transparent:true,opacity:.16})));});}
let hlIdx=null;
function applyHighlight(actives){
  actives.forEach((a,i)=>{
    if(!a.flow)return;
    const dim=hlIdx!==null&&hlIdx!==i;
    a.flow.traverse(o=>{if(!o.material)return;

function runEngine(){

    const e2=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    camera.position.copy(camAnim.from.clone().lerp(camAnim.to,e2).normalize().multiplyScalar(camAnim.dist));
    camera.lookAt(0,0,0);
    if(u>=1)camAnim=null;}
  updateLabels();
  pulses.forEach(rg=>{const s=1+.9*((now/1400+rg.userData.ph)%1);
    rg.scale.set(s,s,s);rg.material.opacity=Math.max(0,1.15-s*.55);});
  /* 파급 맥동: 세대 캐스케이드 — 진앙 세대가 먼저, 다음 세대가 이어서 동시 방사 */
  flows.forEach(f=>{
    const U=((now/3000)+f.ph)%1;
    f.pulses.forEach(p=>{
      const lu=U*f.nGen-p.arc.gen;
      if(lu>0&&lu<1){p.m.visible=true;p.m.position.copy(p.arc.curve.getPoint(lu));}
      else p.m.visible=false;});});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);fitCamera();});
</script>
</body>
