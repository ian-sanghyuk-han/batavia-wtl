function fitCamera(){

  controls.maxDistance=Math.max(5.5,d+.4);

  fragmentShader:'uniform vec3 c;varying vec3 vN;void main(){float i=pow(.58-dot(vN,vec3(0.,0.,1.)),2.6);gl_FragColor=vec4(c,1.)*i*.7;}'});

const COUNTRIES='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
fetch(COUNTRIES).then(r=>r.json()).then(topo=>{
  const feats=topojson.feature(topo,topo.objects.countries).features;
  const c=document.createElement('canvas');c.width=4096;c.height=2048;
  const x=c.getContext('2d');
  x.fillStyle='#0b131c';x.fillRect(0,0,4096,2048); /* 바다 */
  const px=(lo)=> (lo+180)/360*4096, py=(la)=> (90-la)/180*2048;
  feats.forEach((f,fi)=>{
    const shade=0.85+((fi*2654435761)%1000)/1000*0.3; /* 나라별 결정적 음영 */
    const g0=Math.round(24*shade),g1=Math.round(34*shade),g2=Math.round(44*shade);
    x.fillStyle=`rgb(${g0},${g1},${g2})`;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    /* 날짜변경선: 경도 언랩 + ±폭 오프셋 3회 (전폭 띠 누출 방지) · 남극은 원본(극관 정당 채움) */
    if((f.properties.name||'').toLowerCase()==='antarctica'){
      polys.forEach(poly=>{
        x.beginPath();
        poly.forEach(ring=>{ring.forEach((p,i)=>{i?x.lineTo(px(p[0]),py(p[1])):x.moveTo(px(p[0]),py(p[1]));});x.closePath();});
        x.fill('evenodd');});
      x.fillRect(0,py(-82.8),4096,2048-py(-82.8)); /* 데이터 공백 극관 채움 */
      return;}
    polys.forEach(poly=>{
      [-4096,0,4096].forEach(off=>{
        x.beginPath();
        poly.forEach(ring=>{
          let prev=null;
          ring.forEach((p,i)=>{
            let lo=p[0];
            if(prev!==null){while(lo-prev>180)lo-=360;while(lo-prev<-180)lo+=360;}
            prev=lo;
            const X=(lo+180)/360*4096+off;
            i?x.lineTo(X,py(p[1])):x.moveTo(X,py(p[1]));});
          x.closePath();});
        x.fill('evenodd');});});});
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.generateMipmaps=false;t.minFilter=THREE.LinearFilter; /* 극지 밴딩 방지 */
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  earth.material=new THREE.MeshBasicMaterial({map:t});
  /* 벡터 경계 */
  function meshToSegs(mesh,r){
    const verts=[];
    const lines=mesh.type==='MultiLineString'?mesh.coordinates:[mesh.coordinates];
    lines.forEach(line=>{for(let i=0;i<line.length-1;i++){
      if(line[i][1]<-82.8&&line[i+1][1]<-82.8)continue; /* 남극 절단선 제외 */
      const a=toV3(line[i][1],line[i][0],r),b=toV3(line[i+1][1],line[i+1][0],r);
      verts.push(a.x,a.y,a.z,b.x,b.y,b.z);}});
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));

  const inner=topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b);

  earth.add(new THREE.LineSegments(meshToSegs(coast,R*1.0015),
    new THREE.LineBasicMaterial({color:0x9FC0D6,transparent:true,opacity:.38})));
  /* 전국 라벨 자동 생성 (경제 티어) */
  const T1=new Set(['united states of america','china','japan','germany','india',

  const T2=new Set(['spain','netherlands','turkey','switzerland','poland','argentina',

    'thailand','egypt','denmark','malaysia','vietnam','philippines','bangladesh',

    'portugal','new zealand','peru','greece','iraq','qatar','kazakhstan','hungary',
    'kuwait','morocco','ukraine','iran','pakistan','algeria','ethiopia','venezuela',
    'antarctica','greenland']);
  function centroidOf(f){
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    let ring=polys[0][0];
    polys.forEach(p=>{if(p[0].length>ring.length)ring=p[0];});
    const v=new THREE.Vector3();
    ring.forEach(([lo,la])=>v.add(toV3(la,lo,1)));
    v.normalize();
    const la=Math.asin(v.y)/D2R;
    const lo=Math.atan2(v.z,-v.x)/D2R-180;
    return [la,((lo+540)%360)-180];}
  feats.forEach(f=>{
    const nm=f.properties&&f.properties.name;if(!nm)return;
    const key=nm.toLowerCase();
    const tier=T1.has(key)?1:T2.has(key)?2:3;
    const cc=centroidOf(f);
    addLabel(nm.toUpperCase(),cc[0],cc[1],tier);});
}).catch(()=>{});

/* ── 라벨: 티어 + 줌 게이팅 + 크기 위계 ── */
function labelSprite(txt,tier){
  const c=document.createElement('canvas');c.width=640;c.height=96;
  const x=c.getContext('2d');
  const size=tier===1?40:tier===2?31:tier===4?28:tier===5?23:24;
  x.font=`600 ${size}px Consolas,monospace`;x.textAlign='center';x.textBaseline='middle';
  x.letterSpacing=tier===1?'5px':'3px';
  x.lineWidth=7;x.strokeStyle='rgba(4,8,13,.85)';x.strokeText(txt,320,48);
  x.fillStyle=tier===1?'rgba(224,238,248,.95)':tier===2?'rgba(196,216,232,.88)'
    :tier===4?'rgba(159,199,224,.95)':tier===5?'rgba(143,178,204,.85)':'rgba(158,180,198,.8)';
  x.fillText(txt,320,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,opacity:0}));
  s.renderOrder=20;
  const k=tier===1?.34:tier===2?.26:tier===4?.22:tier===5?.18:.20;
  s.scale.set(k,k*96/640,1);return s;}
const labelObjs=[];
function addLabel(txt,la,lo,tier){
  const s=labelSprite(txt,tier);
  s.position.copy(toV3(la,lo,R*1.012));
  labelObjs.push({s,tier,normal:s.position.clone().normalize()});
  earth.add(s);}

{const geo=new THREE.SphereGeometry(.0042,8,8);

const hull=new THREE.ConeGeometry(.0055,.018,4);hull.rotateX(Math.PI/2);
fetch('data/ships.json').then(r=>r.json()).then(d=>{
  const fleet=(d&&d.fleet)||[];
  [['tanker',0xFF9A5A],['cargo',0x5FD8E8],['unknown',0x8fa3b3]].forEach(([tt,col])=>{
    const ships=fleet.filter(s=>s.t===tt);if(!ships.length)return;
    const im=new THREE.InstancedMesh(hull,new THREE.MeshBasicMaterial({color:col}),ships.length);
    const d3=new THREE.Object3D();
    ships.forEach((s,i)=>{const p=toV3(s.la,s.lo,R*1.004);
      d3.position.copy(p);d3.lookAt(p.clone().multiplyScalar(2));

      d3.updateMatrix();im.setMatrixAt(i,d3.matrix);});
    im.instanceMatrix.needsUpdate=true;earth.add(im);});
}).catch(()=>{});

    const sz=.008+.002*(e.sev||3);
    const ring=new THREE.Mesh(new THREE.RingGeometry(sz,sz*1.35,32),
      new THREE.MeshBasicMaterial({color:0xFF5D6E,transparent:true,side:THREE.DoubleSide}));
    ring.position.copy(p);ring.lookAt(p.clone().multiplyScalar(2));
    ring.userData={ph:Math.random()*6.28};
    earth.add(ring);pulses.push(ring);});
  const list=document.getElementById('newslist');
  list.innerHTML=evs.slice(0,6).map(e=>{
    const t=(e.ts_pub||'').replace('T',' ').slice(5,16);
    return `<a class="nv" href="${e.url}" target="_blank" rel="noopener">`+
      `<span class="sev" style="opacity:${.4+.15*(e.sev||3)}"></span>${e.name}`+
      `<small>${e.src||''} · ${t} · 심각도 ${e.sev}/5</small></a>`;}).join('');
}).catch(()=>{document.getElementById('newslist').textContent='뉴스 로드 실패';});

/* ══ 국면 자동 테마 (실측 conv → 무대 조명) ══ */
const REGIMES={
  steady:{en:'STEADY',name:'평온',acc:'#7FD8FF',atm:0x9fc7e0},
  tension:{en:'TENSION',name:'긴장',acc:'#E8A33D',atm:0xE8A33D},
  alert:{en:'ALERT',name:'경보',acc:'#FF6A6E',atm:0xFF6A6E}};
fetch('data/regime.json').then(r=>r.json()).then(d=>{
  const v=d.conv&&d.conv.value, th=(d.conv&&d.conv.thresholds)||{tension:.38,alert:.55};
  const state=v>=th.alert?'alert':v>=th.tension?'tension':'steady';
  const t=REGIMES[state];
  document.documentElement.style.setProperty('--acc',t.acc);
  atmMat.uniforms.c.value.set(t.atm);
  document.getElementById('rgname').textContent=t.en+' · '+t.name;
  document.getElementById('rgval').textContent=`동조도 ${v.toFixed(3)} (긴장 ${th.tension} · 경보 ${th.alert})`;
  document.getElementById('rgprov').textContent=(d.conv&&d.conv.provenance||'')+' · 실측';
}).catch(()=>{document.getElementById('rgname').textContent='—';});

/* ══ 시장 티커 (실측) — 한국 관례: 상승 적색 · 하락 청색 ══ */
fetch('data/market.json').then(r=>r.json()).then(d=>{
  const el=document.getElementById('ticker');
  const s=d.series||{};
  el.innerHTML=Object.values(s).map(v=>{
    let chg,txt;
    if(v.delta_kind==='pct'){chg=v.prev?(v.value/v.prev-1)*100:0;txt=`${chg>=0?'+':''}${chg.toFixed(2)}%`;}
    else{chg=v.value-(v.prev??v.value);txt=`${chg>=0?'+':''}${chg.toFixed(2)}%p`;}
    const cls=chg>0.0001?'up':chg<-0.0001?'dn':'fl';
    const arrow=chg>0.0001?'▲':chg<-0.0001?'▼':'—';
    return `<span class="tk">${v.label} <b>${v.value}</b> <span class="${cls}">${arrow} ${txt}</span></span>`;
  }).join('');
}).catch(()=>{});

/* ══ 파급 엔진 (원장 v0): 진앙 → 발동 카드 → 관측 노드 ══
   판정 재료는 전부 실측 피드(뉴스·시장·국면·등록 이벤트) — 연결 규칙은 v0 추정으로 명시 */
const rippleGroup=new THREE.Group();earth.add(rippleGroup);
const flows=[]; /* {curves,pulse,ph,group} */
function arcCurve(a,b,h){
  const A=toV3(a[0],a[1],R),B=toV3(b[0],b[1],R);
  const M=A.clone().add(B).multiplyScalar(.5).normalize().multiplyScalar(R*(1+h));
  return new THREE.QuadraticBezierCurve3(A.clone().multiplyScalar(1.004),M,B.clone().multiplyScalar(1.004));}
function havKm(a,b){
  const p1=a[0]*D2R,p2=b[0]*D2R,dp=(b[0]-a[0])*D2R,dl=(b[1]-a[1])*D2R;
  const s=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
function drawFlow(active,idx){
  const col=new THREE.Color(active.card.color);
  const pts=[];
  if(active.anchor)pts.push(active.anchor);
  (active.card.path||[]).forEach(p=>pts.push(p));
  if(pts.length<2)return;
  const group=new THREE.Group();
  const curves=[];
  for(let i=0;i<pts.length-1;i++){
    const cv=arcCurve(pts[i],pts[i+1],.09+.05*Math.min(2,i));
    curves.push(cv);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(cv,48,.0028,6,false),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.5})));}
  const pulse=new THREE.Mesh(new THREE.SphereGeometry(.0075,8,8),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.95}));
  group.add(pulse);
  rippleGroup.add(group);
  flows.push({curves,pulse,ph:idx*.37,group});
  active.flow=group;}
let hlIdx=null;
function applyHighlight(actives){
  actives.forEach((a,i)=>{
    if(!a.flow)return;
    const dim=hlIdx!==null&&hlIdx!==i;
    a.flow.traverse(o=>{if(o.material)o.material.opacity=o===a.flow.children[a.flow.children.length-1]
      ?(dim?.15:.95):(dim?.08:.5);});});}
Promise.all([
  fetch('logic/ledger.json').then(r=>r.json()),
  fetch('data/news.json').then(r=>r.json()).catch(()=>({events:[]})),
  fetch('data/market.json').then(r=>r.json()).catch(()=>({series:{}})),
  fetch('data/regime.json').then(r=>r.json()).catch(()=>null),
  fetch('data/event_card.json').then(r=>r.json()).catch(()=>null)
]).then(([led,news,mkt,rg,ev])=>{
  const actives=[];
  const seen=new Set(); /* 카드당 최대 1건 (가장 먼저 잡힌 근거) */
  const push=(a)=>{if(seen.has(a.card.id))return;seen.add(a.card.id);actives.push(a);};
  led.cards.forEach(card=>{
    const tr=card.trigger||{};
    if(tr.type==='event_upcoming'&&ev&&ev.event){
      push({card,anchor:null,
        reason:`${ev.event.name} · ${ev.event.release_kst} 발표 예정`,label:'실측 일정'});}
    else if(tr.type==='market_move'){
      const s=mkt.series&&mkt.series[tr.series];
      if(s&&s.prev){const chg=(s.value/s.prev-1)*100;
        if(Math.abs(chg)>=tr.abs_pct_min)
          push({card,anchor:card.anchor||null,
            reason:`${s.label} ${chg>=0?'+':''}${chg.toFixed(2)}% (실측)`,label:'실측'});}}
    else if(tr.type==='regime_conv'&&rg&&rg.conv){
      if(rg.conv.value>=tr.min)
        push({card,anchor:null,
          reason:`동조도 ${rg.conv.value.toFixed(3)} ≥ ${tr.min} (실측)`,label:'실측'});}
    else if(tr.type==='news_cameo'||tr.type==='news_cameo_near'){
      (news.events||[]).forEach(e=>{
        if(seen.has(card.id))return;
        if(!(tr.codes||[]).includes(e.code))return;
        if((e.sev||0)<(tr.sev_min||0))return;
        if(tr.type==='news_cameo_near'){
          let near=null;
          Object.values(led.chokepoints||{}).forEach(cp=>{
            const d=havKm([e.la,e.lo],[cp.la,cp.lo]);
            if(d<=tr.radius_km&&(!near||d<near.d))near={cp,d};});
          if(!near)return;
          push({card,anchor:[near.cp.la,near.cp.lo],
            reason:`${near.cp.name} 반경 ${Math.round(near.d)}km · 심각도 ${e.sev}/5 (실측 GDELT)`,label:'실측 뉴스'});
        }else{
          push({card,anchor:[e.la,e.lo],
            reason:`정치 불확실성 · 심각도 ${e.sev}/5 (실측 GDELT)`,label:'실측 뉴스'});}});}
  });
  actives.forEach((a,i)=>drawFlow(a,i));
  /* 패널 */
  document.getElementById('cardsbtn').textContent=`활성 카드 ${actives.length}`;
  const el=document.getElementById('cardlist');
  if(!actives.length){
    el.innerHTML='<div class="cv" style="cursor:default">지금 파급 관측 없음 — 무소식도 기록됩니다 (관측 유지)</div>';
  }else{
    el.innerHTML=actives.map((a,i)=>
      `<div class="cv" data-i="${i}">`+
      `<span class="dot" style="background:${a.card.color}"></span>`+
      `<b>${a.card.id}</b> ${a.card.name} · ${a.card.grade}`+
      `<small>발동 근거: ${a.reason}</small>`+
      `<small>${a.card.core} · ${a.card.path_note||''} · ${a.label}</small></div>`).join('');
    el.querySelectorAll('.cv').forEach(d=>d.addEventListener('click',()=>{
      const i=+d.dataset.i;
      hlIdx=(hlIdx===i)?null:i;
      el.querySelectorAll('.cv').forEach((x,xi)=>x.classList.toggle('on',hlIdx===xi));
      applyHighlight(actives);}));}
  document.getElementById('cardfoot').textContent=led.label||'';
}).catch(()=>{document.getElementById('cardlist').textContent='원장 로드 실패';});

/* 패널 토글 (하나 열면 다른 하나 닫힘) */
const newsEl=document.getElementById('news');
const cardsEl=document.getElementById('cards');
document.getElementById('newsbtn').addEventListener('click',()=>{
  newsEl.classList.toggle('on');cardsEl.classList.remove('on');});
document.getElementById('cardsbtn').addEventListener('click',()=>{
  cardsEl.classList.toggle('on');newsEl.classList.remove('on');});

let frames=0,fpsT=performance.now();
function loop(now){
  controls.update();
  updateLabels();
  pulses.forEach(rg=>{const s=1+.9*((now/1400+rg.userData.ph)%1);
    rg.scale.set(s,s,s);rg.material.opacity=Math.max(0,1.15-s*.55);});
  /* 파급 맥동: 경로를 따라 흐르는 빛 */
  flows.forEach(f=>{
    const u=((now/2600)+f.ph)%1;
    const n=f.curves.length;
    const seg=Math.min(n-1,Math.floor(u*n));
    f.pulse.position.copy(f.curves[seg].getPoint(u*n-seg));});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);fitCamera();});
</script>
