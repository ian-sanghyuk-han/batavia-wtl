const W2=4,H2=2; /* 평면 지도의 폭·높이 */

function sphV3(la,lo,r){const phi=(90-la)*D2R,th=(lo+180)*D2R;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));}
function toV3(la,lo,r){
  if(VIEW==='2d')return new THREE.Vector3(lo/180*(W2/2),la/90*(H2/2),(r-R)*2.2);
  return sphV3(la,lo,r);}
function fitCamera(){
  if(VIEW!=='3d')return;
  const fovY=camera.fov*Math.PI/180;
  const fovX=2*Math.atan(Math.tan(fovY/2)*camera.aspect);
  const half=Math.min(fovY,fovX)/2;
  const d=Math.max(2.9,1.18/Math.sin(half));
  controls.maxDistance=Math.max(5.5,d+.4);
  if(camera.position.length()<d)camera.position.setLength(d);}

/* 별 */

function fillCanvasTexture(){ /* 등장방형 채움 — 구·평면 공용 */
  const feats=topojson.feature(topoCache,topoCache.objects.countries).features;
  const c=document.createElement('canvas');c.width=4096;c.height=2048;
  const x=c.getContext('2d');
  x.fillStyle='#0b131c';x.fillRect(0,0,4096,2048);
  const px=(lo)=>(lo+180)/360*4096,py=(la)=>(90-la)/180*2048;
  feats.forEach((f,fi)=>{
    const shade=0.85+((fi*2654435761)%1000)/1000*0.3;
    x.fillStyle=`rgb(${Math.round(24*shade)},${Math.round(34*shade)},${Math.round(44*shade)})`;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    if((f.properties.name||'').toLowerCase()==='antarctica'){
      polys.forEach(poly=>{x.beginPath();
        poly.forEach(ring=>{ring.forEach((p,i)=>{i?x.lineTo(px(p[0]),py(p[1])):x.moveTo(px(p[0]),py(p[1]));});x.closePath();});
        x.fill('evenodd');});
      x.fillRect(0,py(-82.8),4096,2048-py(-82.8));
      return;}
    polys.forEach(poly=>{
      [-4096,0,4096].forEach(off=>{
        x.beginPath();
        poly.forEach(ring=>{
          let prev=null;
          ring.forEach((p,i)=>{
            let lo=p[0];
            if(prev!==null){while(lo-prev>180)lo-=360;while(lo-prev<-180)lo+=360;}
            prev=lo;
            const X=(lo+180)/360*4096+off;
            i?x.lineTo(X,py(p[1])):x.moveTo(X,py(p[1]));});
          x.closePath();});
        x.fill('evenodd');});});});
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;}

function meshToSegs(mesh,r){
  const verts=[];
  const lines=mesh.type==='MultiLineString'?mesh.coordinates:[mesh.coordinates];
  lines.forEach(line=>{for(let i=0;i<line.length-1;i++){
    if(line[i][1]<-82.8&&line[i+1][1]<-82.8)continue;
    if(VIEW==='2d'&&Math.abs(line[i][0]-line[i+1][0])>180)continue; /* 평면: 날짜변경선 관통 선 제거 */
    const a=toV3(line[i][1],line[i][0],r),b=toV3(line[i+1][1],line[i+1][0],r);
    verts.push(a.x,a.y,a.z,b.x,b.y,b.z);}});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
  return g;}

function centroidOf(f){ /* 구면 단위벡터 평균 — 뷰와 무관하게 항상 구면 기준 */
  const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
  let ring=polys[0][0];
  polys.forEach(p=>{if(p[0].length>ring.length)ring=p[0];});
  const v=new THREE.Vector3();
  ring.forEach(([lo,la])=>v.add(sphV3(la,lo,1)));
  v.normalize();
  const la=Math.asin(v.y)/D2R;
  const lo=Math.atan2(v.z,-v.x)/D2R-180;
  return [la,((lo+540)%360)-180];}

function labelSprite(txt,tier){
  const c=document.createElement('canvas');c.width=640;c.height=96;
  const x=c.getContext('2d');
  const size=tier===1?40:tier===2?31:tier===4?28:tier===5?23:24;
  x.font=`600 ${size}px Consolas,monospace`;x.textAlign='center';x.textBaseline='middle';
  x.letterSpacing=tier===1?'5px':'3px';
  x.lineWidth=7;x.strokeStyle='rgba(4,8,13,.85)';x.strokeText(txt,320,48);
  x.fillStyle=tier===1?'rgba(224,238,248,.95)':tier===2?'rgba(196,216,232,.88)'
    :tier===4?'rgba(159,199,224,.95)':tier===5?'rgba(143,178,204,.85)':'rgba(158,180,198,.8)';
  x.fillText(txt,320,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,opacity:0}));
  s.renderOrder=20;
  const k=tier===1?.34:tier===2?.26:tier===4?.22:tier===5?.18:.20;
  s.scale.set(k,k*96/640,1);return s;}
function addLabel(txt,la,lo,tier){
  const s=labelSprite(txt,tier);

  labelObjs.push({s,tier,normal:VIEW==='2d'?new THREE.Vector3(0,0,1):s.position.clone().normalize()});
  stage.add(s);}

/* 호 곡선 — 3D: 대권+고도 ∝ 거리 · 평면: 베지어 리프트 */
function arcCurve(a,b){
  if(VIEW==='2d'){
    const A=toV3(a[0],a[1],R*1.004),B=toV3(b[0],b[1],R*1.004);
    const d=A.distanceTo(B);
    const M=A.clone().add(B).multiplyScalar(.5);M.z+=.06+.1*Math.min(1,d/2);
    return new THREE.QuadraticBezierCurve3(A,M,B);}
  const A=sphV3(a[0],a[1],1),B=sphV3(b[0],b[1],1);
  const ang=A.angleTo(B);
  const h=.05+.16*(ang/Math.PI);
  const pts=[];
  for(let i=0;i<=32;i++){
    const t=i/32;
    const s=Math.sin((1-t)*ang)/Math.sin(ang),c=Math.sin(t*ang)/Math.sin(ang);
    const p=A.clone().multiplyScalar(s).add(B.clone().multiplyScalar(c)).normalize();
    p.multiplyScalar(R*(1.004+h*Math.sin(Math.PI*t)));
    pts.push(p);}
  return new THREE.CatmullRomCurve3(pts);}
function surfaceArc(a,b){
  if(VIEW==='2d'){
    const A=toV3(a[0],a[1],R*1.002),B=toV3(b[0],b[1],R*1.002);
    const M=A.clone().add(B).multiplyScalar(.5);M.z+=.015;
    return new THREE.QuadraticBezierCurve3(A,M,B);}
  const A=sphV3(a[0],a[1],1),B=sphV3(b[0],b[1],1);
  const ang=A.angleTo(B);
  const pts=[];
  for(let i=0;i<=32;i++){
    const t=i/32;
    const s=Math.sin((1-t)*ang)/Math.sin(ang),c=Math.sin(t*ang)/Math.sin(ang);
    const p=A.clone().multiplyScalar(s).add(B.clone().multiplyScalar(c)).normalize();
    p.multiplyScalar(R*(1.0035+.012*Math.sin(Math.PI*t)));
    pts.push(p);}
  return new THREE.CatmullRomCurve3(pts);}
function orient(o,p){ /* 표면 요소의 방향: 3D 법선 / 평면 +z */
  if(VIEW==='2d')o.lookAt(p.x,p.y,p.z+1);
  else o.lookAt(p.clone().multiplyScalar(2));}

function havKm(a,b){
  const p1=a[0]*D2R,p2=b[0]*D2R,dp=(b[0]-a[0])*D2R,dl=(b[1]-a[1])*D2R;
  const s=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}

function toneColor(e){return e.tone<=-3?'#FF5D6E':e.tone>=2?'#3FE0A0':'#D9A441';}
function relKo(ts){
  if(!ts)return '';
  let t;
  if(/^\d{14}$/.test(ts))t=Date.UTC(+ts.slice(0,4),+ts.slice(4,6)-1,+ts.slice(6,8),
    +ts.slice(8,10),+ts.slice(10,12),+ts.slice(12,14));
  else{const d=new Date(ts);if(isNaN(d))return '';t=d.getTime();}
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전';}

function renderShips(){
  if(!shipsGroup)return;
  shipsGroup.clear();
  const hull=new THREE.ConeGeometry(.0055,.018,4);hull.rotateX(Math.PI/2);
  [['tanker',0xFF9A5A],['cargo',0x5FD8E8],['unknown',0x8fa3b3]].forEach(([tt,col])=>{
    const ships=shipsCache.filter(s=>s.t===tt);if(!ships.length)return;
    const im=new THREE.InstancedMesh(hull,new THREE.MeshBasicMaterial({color:col}),ships.length);
    const d3=new THREE.Object3D();
    ships.forEach((s,i)=>{const p=toV3(s.la,s.lo,R*1.004);
      d3.position.copy(p);orient(d3,p);
      if(s.cog!=null)d3.rotateZ(-s.cog*D2R);
      d3.updateMatrix();im.setMatrixAt(i,d3.matrix);});
    im.instanceMatrix.needsUpdate=true;shipsGroup.add(im);});}
function renderNewsPulses(){
  if(!newsLayer)return;
  newsLayer.clear();pulses.length=0;
  newsLog.slice(0,12).forEach(e=>{
    const p=toV3(e.la,e.lo,R*1.008);
    const sz=.008+.002*(e.sev||3);
    const ring=new THREE.Mesh(new THREE.RingGeometry(sz,sz*1.35,32),
      new THREE.MeshBasicMaterial({color:new THREE.Color(toneColor(e)),transparent:true,side:THREE.DoubleSide}));
    ring.position.copy(p);orient(ring,p);
    ring.userData={ph:Math.random()*6.28};
    newsLayer.add(ring);pulses.push(ring);});}
function drawRoutes(){
  if(!routesGroup||!ledCache)return;
  routesGroup.clear();
  (ledCache.routes||[]).forEach(rt=>{
    routesGroup.add(new THREE.Mesh(new THREE.TubeGeometry(surfaceArc(rt.a,rt.b),40,.0016,5,false),
      new THREE.MeshBasicMaterial({color:new THREE.Color(rt.c),transparent:true,opacity:.16})));});}
function drawFlow(active,idx){
  const col=new THREE.Color(active.card.color);
  let gens=(active.card.spread||[]).map(g=>g.slice());
  if(active.anchor)gens=[[active.anchor],...gens];
  if(gens.length<2)return;
  const group=new THREE.Group();
  const arcs=[];
  for(let g=0;g<gens.length-1;g++){
    gens[g].forEach(from=>{gens[g+1].forEach(to=>{
      const cv=arcCurve(from,to);
      arcs.push({curve:cv,gen:g});
      group.add(new THREE.Mesh(new THREE.TubeGeometry(cv,48,.0026,6,false),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.45})));});});}
  const ps=arcs.map(a=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(.0065,8,8),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.95}));
    m.visible=false;group.add(m);
    return {m,arc:a};});
  rippleGroup.add(group);
  flows.push({pulses:ps,nGen:gens.length-1,ph:idx*.37,group});
  active.flow=group;}
function drawRipples(){
  if(!rippleGroup)return;
  rippleGroup.clear();flows.length=0;
  activesCache.forEach((a,i)=>drawFlow(a,i));
  applyHighlight();}
function applyHighlight(){
  activesCache.forEach((a,i)=>{
    if(!a.flow)return;
    const dim=hlIdx!==null&&hlIdx!==i;
    a.flow.traverse(o=>{if(!o.material)return;
      const isPulse=o.geometry&&o.geometry.type==='SphereGeometry';
      o.material.opacity=isPulse?(dim?.1:.95):(dim?.08:.45);});});}

function buildStage(){

  labelObjs.length=0;

                      :new THREE.Mesh(new THREE.SphereGeometry(R,96,96),mat);
  stage.add(baseMesh);
  /* 경계 + 라벨 */
  innerL=coastL=null;
  if(topoCache){
    const inner=topojson.mesh(topoCache,topoCache.objects.countries,(a,b)=>a!==b);
    innerL=new THREE.LineSegments(meshToSegs(inner,R*1.0018),
      new THREE.LineBasicMaterial({color:0xBFD9EA,transparent:true,opacity:.55}));

    const coast=topojson.mesh(topoCache,topoCache.objects.countries,(a,b)=>a===b);

      new THREE.LineBasicMaterial({color:0x9FC0D6,transparent:true,opacity:.38}));
    stage.add(coastL);
    topojson.feature(topoCache,topoCache.objects.countries).features.forEach(f=>{
      const nm=f.properties&&f.properties.name;if(!nm)return;
      const key=nm.toLowerCase();
      const tier=T1.has(key)?1:T2.has(key)?2:3;
      const cc=centroidOf(f);
      addLabel(nm.toUpperCase(),cc[0],cc[1],tier);});}
  CITY4.forEach(([n,la,lo])=>addLabel(n,la,lo,4));
  CITY5.forEach(([n,la,lo])=>addLabel(n,la,lo,5));
  /* 도시 점 + 관측 노드 점 */
  {const geo=new THREE.SphereGeometry(.0042,8,8);
   const all=[...CITY4,...CITY5];
   cityIM=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:0x8fa6b8,transparent:true,opacity:.8}),all.length);

   all.forEach((c2,i)=>{d3.position.copy(toV3(c2[1],c2[2],R*1.0025));d3.updateMatrix();cityIM.setMatrixAt(i,d3.matrix);});
   cityIM.instanceMatrix.needsUpdate=true;stage.add(cityIM);}
  {const geo=new THREE.SphereGeometry(.0075,10,10);
   obsIM=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:0xEAF9FF}),OBS.length);
   const d3=new THREE.Object3D();
   OBS.forEach((c2,i)=>{d3.position.copy(toV3(c2[0],c2[1],R*1.003));d3.updateMatrix();obsIM.setMatrixAt(i,d3.matrix);});
   obsIM.instanceMatrix.needsUpdate=true;stage.add(obsIM);}
  /* 데이터 레이어 */
  routesGroup=new THREE.Group();stage.add(routesGroup);drawRoutes();
  shipsGroup=new THREE.Group();stage.add(shipsGroup);renderShips();
  newsLayer=new THREE.Group();stage.add(newsLayer);renderNewsPulses();
  rippleGroup=new THREE.Group();stage.add(rippleGroup);drawRipples();

function updateLabels(){
  const camDir=camera.position.clone().normalize();
  const dist=VIEW==='2d'?camera.position.z+1.2:camera.position.length();
  labelObjs.forEach(o=>{
    if(logicOn){o.s.material.opacity=0;return;}
    if(o.tier<=3&&!L.clabels){o.s.material.opacity=0;return;}
    if(o.tier>=4&&!L.citylabels){o.s.material.opacity=0;return;}
    const facing=VIEW==='2d'?1:o.normal.dot(camDir);
    const tierOn=o.tier===1||(o.tier===2&&dist<2.5)||(o.tier===3&&dist<1.85)
      ||(o.tier===4&&dist<1.95)||(o.tier===5&&dist<1.6);
    const fade=VIEW==='2d'?1:THREE.MathUtils.smoothstep(facing,.12,.35);
    o.s.material.opacity=tierOn?fade*.95:0;});}

let camAnim=null,autoT=null;
function rotateTo(la,lo){
  if(VIEW==='2d'){
    const p=toV3(la,lo,R);
    camAnim={mode:'pan',fx:camera.position.x,fy:camera.position.y,tx:p.x,ty:p.y,t0:performance.now()};
    return;}
  const from=camera.position.clone().normalize();
  const to=sphV3(la,lo,1).normalize();
  if(from.dot(to)<-0.999)to.x+=.01;
  camAnim={mode:'orbit',from,to,dist:camera.position.length(),t0:performance.now()};
  const was=controls.autoRotate;controls.autoRotate=false;
  clearTimeout(autoT);autoT=setTimeout(()=>{if(MODE==='3d')controls.autoRotate=was;},15000);}
function configCamera(){
  if(VIEW==='2d'){
    controls.enableRotate=false;controls.enablePan=true;controls.screenSpacePanning=true;
    controls.autoRotate=false;
    controls.minDistance=.6;controls.maxDistance=4;
    controls.target.set(0,0,0);
    camera.position.set(0,0,2.4);camera.lookAt(0,0,0);
  }else{
    controls.enableRotate=true;controls.enablePan=false;
    controls.autoRotate=MODE==='3d'&&AUTOROT;
    controls.minDistance=1.4;controls.maxDistance=5.5;
    controls.target.set(0,0,0);
    if(Math.abs(camera.position.z-2.4)<.01&&Math.abs(camera.position.x)<2.1&&Math.abs(camera.position.y)<1.1)
      camera.position.set(0,.5,2.9);
    fitCamera();}}

const REGIMES={
  steady:{en:'STEADY',name:'평온',acc:'#7FD8FF',atm:0x9fc7e0},
  tension:{en:'TENSION',name:'긴장',acc:'#E8A33D',atm:0xE8A33D},
  alert:{en:'ALERT',name:'경보',acc:'#FF6A6E',atm:0xFF6A6E}};
function applyRegime(d){
  if(!d||!d.conv)return;
  const v=d.conv.value, th=d.conv.thresholds||{tension:.38,alert:.55};
  const state=v>=th.alert?'alert':v>=th.tension?'tension':'steady';
  const t=REGIMES[state];
  document.documentElement.style.setProperty('--acc',t.acc);
  atmMat.uniforms.c.value.set(t.atm);
  rimMat.uniforms.c.value.set(t.atm);
  document.getElementById('rgname').textContent=t.en+' · '+t.name;
  document.getElementById('rgval').textContent=`동조도 ${v.toFixed(3)} (긴장 ${th.tension} · 경보 ${th.alert})`;
  document.getElementById('rgprov').textContent=d.conv.provenance||'';}

/* ── 전광판 티커 ── */
function renderTicker(d){
  const s=(d&&d.series)||{};
  const ORDER=['spx','shanghai','nikkei','dax','sensex','ftse','kospi',
    'us2y','us10y','dxy','vix','wti','copper','gold','btc'];
  const keys=[...ORDER.filter(k=>s[k]),...Object.keys(s).filter(k=>!ORDER.includes(k))];
  const html=keys.map(k=>s[k]).map(v=>{
    let chg,txt;
    if(v.delta_kind==='pct'){chg=v.prev?(v.value/v.prev-1)*100:0;txt=`${chg>=0?'+':''}${chg.toFixed(2)}%`;}
    else{chg=v.value-(v.prev??v.value);txt=`${chg>=0?'+':''}${chg.toFixed(2)}%p`;}
    const cls=chg>0.0001?'up':chg<-0.0001?'dn':'fl';
    const arrow=chg>0.0001?'▲':chg<-0.0001?'▼':'—';
    return `<span class="tk">${v.label} <b>${v.value}</b> <span class="${cls}">${arrow} ${txt}</span></span>`;
  }).join('');
  const rail=document.getElementById('tickrail');
  rail.innerHTML=html+html; /* 이어붙여 무한 순환 */
  rail.style.setProperty('--mqd',`${Math.max(30,keys.length*5)}s`);}

      ` · 수집 ${String(k.getUTCHours()).padStart(2,'0')}:${String(k.getUTCMinutes()).padStart(2,'0')} KST`;}

function startToast(){
  if(headTimer)return;
  const tEl=document.getElementById('toast');

    const items=newsLog.slice(0,8);
    if(!items.length){tEl.classList.remove('show');return;}
    const e=items[toastIdx%items.length];toastIdx++;
    tEl.style.borderLeftColor=toneColor(e);
    tEl.innerHTML=`<small>${e.src||''} · ${relKo(e.ts_pub||e.ts)}</small>${e.name}`;
    tEl.dataset.la=e.la;tEl.dataset.lo=e.lo;

    setTimeout(()=>tEl.classList.remove('show'),7500);};

function runEngine(){

  fetch('data/news.json').then(r=>r.json()).catch(()=>({events:[]})),
  fetch('data/market.json').then(r=>r.json()).catch(()=>({series:{}})),
  fetch('data/regime.json').then(r=>r.json()).catch(()=>null),
  fetch('data/event_card.json').then(r=>r.json()).catch(()=>null)
]).then(([led,news,mkt,rg,ev])=>{
  ledCache=led;
  applyRegime(rg);renderTicker(mkt);renderNews(news);
  drawRoutes();
  hlIdx=null;
  const actives=[];
  const seen=new Set();
  const push=(a)=>{if(seen.has(a.card.id))return;seen.add(a.card.id);actives.push(a);};
  led.cards.forEach(card=>{
    const tr=card.trigger||{};
    if(tr.type==='event_upcoming'&&ev&&ev.event){
      const pp=ev.prepricing||{};
      const a2=(pp.assets||{}).us2y;
      const dd=ev.event.release_date?Math.max(0,Math.ceil((new Date(ev.event.release_date+'T00:00:00Z')-Date.now())/86400e3)):null;
      push({card,anchor:null,
        reason:`${ev.event.name} · ${ev.event.release_kst} 발표${dd!=null?` (D-${dd})`:''}`,
        label:'일정',
        calc:[
          pp.index!=null?`선반영 지수 <b>${pp.index}</b> — ${pp.phrase||''}`:null,
          a2?`${a2.label} 이동 <b>${a2.cur}${a2.unit}</b> vs 중앙값 ${a2.hist_median}${a2.unit} → 상위 <b>${Math.round(a2.pctl*100)}%ile</b> (n=${a2.n})`:null,
          ev.prior?`직전 CPI y/y ${ev.prior.yoy}% · m/m ${ev.prior.mom}%`:null
        ].filter(Boolean)});}
    else if(tr.type==='market_move'){
      const s=mkt.series&&mkt.series[tr.series];
      if(s&&s.prev){const chg=(s.value/s.prev-1)*100;
        if(Math.abs(chg)>=tr.abs_pct_min)
          push({card,anchor:card.anchor||null,
            reason:`${s.label} ${chg>=0?'+':''}${chg.toFixed(2)}%`,label:'시장',
            calc:[`|Δ${s.label}| <b>${Math.abs(chg).toFixed(2)}%</b> ≥ 기준 ${tr.abs_pct_min}%`]});}}
    else if(tr.type==='regime_conv'&&rg&&rg.conv){
      if(rg.conv.value>=tr.min)
        push({card,anchor:null,
          reason:`동조도 ${rg.conv.value.toFixed(3)}`,label:'국면',
          calc:[`동조도 <b>${rg.conv.value.toFixed(3)}</b> ≥ 경보선 ${tr.min}`]});}
    else if(tr.type==='news_cameo'||tr.type==='news_cameo_near'){
      (news.events||[]).forEach(e=>{
        if(seen.has(card.id))return;
        if(!(tr.codes||[]).includes(e.code))return;
        if((e.sev||0)<(tr.sev_min||0))return;
        if(tr.type==='news_cameo_near'){
          let near=null;
          Object.values(led.chokepoints||{}).forEach(cp=>{
            const d=havKm([e.la,e.lo],[cp.la,cp.lo]);
            if(d<=tr.radius_km&&(!near||d<near.d))near={cp,d};});
          if(!near)return;
          push({card,anchor:[near.cp.la,near.cp.lo],
            reason:`${near.cp.name} 인근 뉴스`,label:'뉴스',
            calc:[`관문 거리 <b>${Math.round(near.d)}km</b> ≤ ${tr.radius_km}km · 심각도 <b>${e.sev}/5</b> ≥ ${tr.sev_min}`]});
        }else{
          push({card,anchor:[e.la,e.lo],
            reason:`정치 불확실성 관찰`,label:'뉴스',
            calc:[`심각도 <b>${e.sev}/5</b> ≥ ${tr.sev_min} · 논조 ${e.tone>0?'+':''}${e.tone}`]});}});}
  });
  activesCache=actives;
  drawRipples();
  /* 패널 + 상시 카드 */
  document.getElementById('cardsbtn').textContent=`활성 카드 ${actives.length}`;
  const el=document.getElementById('cardlist');
  const bar=document.getElementById('activebar');
  if(!actives.length){
    el.innerHTML='<div class="cv" style="cursor:default">지금 파급 관측 없음 — 무소식도 기록됩니다 (관측 유지)</div>';
    bar.innerHTML='';
  }else{
    el.innerHTML=actives.map((a,i)=>
      `<div class="cv" data-i="${i}">`+
      `<span class="dot" style="background:${a.card.color}"></span>`+
      `<b>${a.card.id}</b> ${a.card.name} · ${a.card.grade}`+
      `<small>발동 근거: ${a.reason}</small>`+
      `<small>${a.card.core} · ${a.card.path_note||''} · ${a.label}</small></div>`).join('');
    bar.innerHTML=actives.map((a,i)=>
      `<div class="acard" data-i="${i}" style="border-left-color:${a.card.color}">`+
      `<div class="r1">${a.card.id} ${a.card.name}<span class="gr">${a.card.grade}</span></div>`+
      `<div class="calc">${(a.calc&&a.calc.length?a.calc:[a.reason]).join('<br>')}</div>`+
      `<div class="src">${a.reason} · ${a.card.core} · ${a.label}</div></div>`).join('');
    const sync=()=>{
      el.querySelectorAll('.cv').forEach((x,xi)=>x.classList.toggle('on',hlIdx===xi));
      bar.querySelectorAll('.acard').forEach((x,xi)=>x.classList.toggle('on',hlIdx===xi));};
    const focusOf=a=>a.anchor||(a.card.spread&&a.card.spread[0]&&a.card.spread[0][0])||null;
    const toggleHl=i=>{
      hlIdx=(hlIdx===i)?null:i;sync();applyHighlight();
      if(hlIdx!==null){const f=focusOf(actives[hlIdx]);if(f)rotateTo(f[0],f[1]);}};
    el.querySelectorAll('.cv').forEach(d=>d.addEventListener('click',()=>toggleHl(+d.dataset.i)));
    bar.querySelectorAll('.acard').forEach(ch=>ch.addEventListener('click',()=>toggleHl(+ch.dataset.i)));}
  document.getElementById('cardfoot').textContent=led.label||'';
}).catch(()=>{document.getElementById('cardlist').textContent='원장 로드 실패';});}

/* ── 초기 로드: 지형 + 함대 → 무대 조립 → 엔진 ── */
const COUNTRIES='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
buildStage(); /* 지형 로드 전 임시 무대 */
fitCamera();  /* 세로(폰) 화면 초기 맞춤 */
Promise.all([
  fetch(COUNTRIES).then(r=>r.json()).catch(()=>null),
  fetch('data/ships.json').then(r=>r.json()).catch(()=>null)
]).then(([topo,sh])=>{
  if(topo){topoCache=topo;fillTex=fillCanvasTexture();}
  if(sh&&sh.fleet)shipsCache=sh.fleet;
  buildStage();
  runEngine();
  setInterval(runEngine,5*60*1000);});

/* 패널 토글 */
const newsEl=document.getElementById('news');
const cardsEl=document.getElementById('cards');
document.getElementById('newsbtn').addEventListener('click',()=>{
  newsEl.classList.toggle('on');cardsEl.classList.remove('on');});
document.getElementById('cardsbtn').addEventListener('click',()=>{
  cardsEl.classList.toggle('on');newsEl.classList.remove('on');});

window.__dbg={get labelObjs(){return labelObjs;},camera,setView,get L(){return L;}};

function loop(now){
  controls.update();
  if(camAnim){
    const u=Math.min(1,(now-camAnim.t0)/900);
    const e2=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    if(camAnim.mode==='pan'){
      const x=camAnim.fx+(camAnim.tx-camAnim.fx)*e2,y=camAnim.fy+(camAnim.ty-camAnim.fy)*e2;
      camera.position.x=x;camera.position.y=y;
      controls.target.set(x,y,0);
    }else{
      camera.position.copy(camAnim.from.clone().lerp(camAnim.to,e2).normalize().multiplyScalar(camAnim.dist));
      camera.lookAt(0,0,0);}
    if(u>=1)camAnim=null;}
  updateLabels();
  pulses.forEach(rg=>{const s=1+.9*((now/1400+rg.userData.ph)%1);
    rg.scale.set(s,s,s);rg.material.opacity=Math.max(0,1.15-s*.55);});
  flows.forEach(f=>{
    const U=((now/3000)+f.ph)%1;
    f.pulses.forEach(p=>{
      const lu=U*f.nGen-p.arc.gen;
      if(lu>0&&lu<1){p.m.visible=true;p.m.position.copy(p.arc.curve.getPoint(lu));}
      else p.m.visible=false;});});
  renderer.render(scene,camera);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);fitCamera();});
</script>
