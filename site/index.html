<!DOCTYPE html>
<html lang="en">
<head>
<!-- STATUS: TODAY v1 - the front door (pivot artifact 1c, built from the approved canvas).
     One plain-language observation a day, live active rules, recent verdicts, NEXT preview.
     The globe lives at observatory.html. All figures carry provenance + est. labels. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BATAVIA PROJECT — Today</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070c">
<script>{const t=localStorage.getItem('bp-theme')||'dark';document.documentElement.dataset.theme=(t==='gundam'||t==='light')?'gundam':'dark';}</script>
<style>
  :root{--acc:#7FD8FF;--ink:#EAF9FF;--dim:#93a7b8;--mut:#5b6b7a;
    --glass:rgba(7,11,17,.60);--glass2:rgba(7,11,17,.74);--edge:rgba(159,199,224,.20);
    --up:#3FE0A0;--dn:#FF6A6E}
  *{box-sizing:border-box}
  body{margin:0;background:#05070c;color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  .glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(9px);border-radius:11px}
  /* the unified nav from the canvas */
  #nav{display:flex;align-items:center;gap:18px;padding:13px 24px;background:var(--glass2);
    border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  #brand{font:600 14px Consolas,monospace;letter-spacing:3px;color:var(--ink);text-decoration:none}
  #brand span{color:var(--mut)}
  #tabs{display:flex;gap:4px;flex-wrap:wrap}
  #tabs a{font:600 11px Consolas,monospace;letter-spacing:2px;padding:8px 14px;border-radius:9px;
    color:var(--dim);text-decoration:none}
  #tabs a.on{color:#06121c;background:var(--acc)}
  #navr{display:flex;align-items:center;gap:10px;margin-left:auto}
  #navr .ghost{font:11px Consolas,monospace;letter-spacing:1px;color:var(--acc);padding:8px 13px;
    border:1px solid var(--edge);border-radius:9px;background:var(--glass);text-decoration:none}
  #navr .cta{font:600 11px Consolas,monospace;letter-spacing:1px;color:#06121c;background:var(--acc);
    padding:8px 15px;border-radius:9px;text-decoration:none}
  #setbtn{color:var(--acc);cursor:pointer;font-size:14px;user-select:none;padding:4px}
  /* body */
  main{max-width:860px;margin:0 auto;padding:34px 20px 50px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
  /* the living globe: canvas 2D orthographic spin (no WebGL — works everywhere) */
  #mglobe{position:fixed;right:-140px;top:128px;width:640px;height:640px;cursor:pointer;z-index:0}
  @media(max-width:1500px){#mglobe{right:-280px;opacity:.75}}
  @media(max-width:1130px){#mglobe{position:static;display:block;width:min(58vw,270px);height:min(58vw,270px);margin:8px auto -4px;opacity:1}}
  #halo{position:fixed;right:-220px;top:110px;width:760px;height:760px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 40% 35%,rgba(159,199,224,.10),rgba(127,216,255,.04) 55%,rgba(5,7,12,0) 72%);
    border:1px solid rgba(159,199,224,.08)}
  .dateline{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
  .dateline b{font:600 13px Consolas,monospace;letter-spacing:3px;color:var(--mut)}
  .chip{font:600 10px Consolas,monospace;letter-spacing:1px;border-radius:6px;padding:2px 9px;border:1px solid var(--edge);color:var(--dim)}
  .chip.acc{color:var(--acc);border-color:var(--acc)}
  #brief{border-left:4px solid var(--acc);padding:24px 28px 20px}
  #brieftxt{font:400 24px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--ink)}
  #brieftxt b{color:var(--ink)}
  #states{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}
  #states .note{font:10px Consolas,monospace;color:var(--mut);margin-left:auto}
  .sec{font:600 10px Consolas,monospace;letter-spacing:2px;color:var(--acc);margin-top:6px}
  .cards{display:flex;gap:13px;flex-wrap:wrap}
  .cd{flex:1;min-width:300px;padding:13px 15px;border-left:4px solid var(--acc)}
  .cd h4{margin:0;font:600 11.5px Consolas,monospace;letter-spacing:1px}
  .cd h4 .gr{float:right;color:var(--acc);font-weight:400}
  .cd p{font:12px/1.6 'Segoe UI';color:#a9becd;margin:6px 0 0}
  .cd small{display:block;font:9.5px Consolas,monospace;color:var(--mut);margin-top:6px}
  #graded{display:flex;gap:10px;align-items:center;padding:11px 15px;flex-wrap:wrap;font:12px 'Segoe UI';color:#c5d7e4}
  #graded .vd{font:600 10px Consolas,monospace;border-radius:6px;padding:2px 8px;border:1px solid var(--edge)}
  #graded .ok{color:var(--up);border-color:rgba(63,224,160,.4)}
  #graded .no{color:var(--dn);border-color:rgba(255,106,110,.4)}
  #graded .tail{font:10px Consolas,monospace;color:var(--mut);margin-left:auto}
  #nextrows{display:flex;flex-direction:column;gap:8px}
  .nx{display:flex;align-items:center;gap:12px;padding:10px 14px;border-left:4px solid var(--acc);text-decoration:none;color:var(--ink)}
  .nx .nm{font:600 11px Consolas,monospace;letter-spacing:1px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nx .p{font:600 16px Consolas,monospace}
  .nx small{font:9px Consolas,monospace;color:var(--mut)}
  .row2{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
  .btn{font:600 11px Consolas,monospace;letter-spacing:1px;border-radius:9px;padding:10px 18px;text-decoration:none}
  .btn.solid{color:#06121c;background:var(--acc)}
  .btn.line{color:var(--acc);border:1px solid var(--edge);background:var(--glass)}
  html[data-theme="gundam"]{--acc:#2c52b3;--ink:#14283c;--dim:#3f5a7a;--mut:#5a708a;
    --glass:rgba(252,253,255,.82);--glass2:rgba(248,250,253,.9);--edge:rgba(44,82,179,.28);
    --up:#1f9d63;--dn:#fb2f38}
  html[data-theme="gundam"] body{background:#e9edf3}
  html[data-theme="gundam"] .glass{box-shadow:0 2px 12px rgba(44,82,179,.10)}
  html[data-theme="gundam"] #halo{background:radial-gradient(circle at 40% 35%,rgba(44,82,179,.08),rgba(44,82,179,.03) 55%,rgba(233,237,243,0) 72%);border-color:rgba(44,82,179,.10)}
  html[data-theme="gundam"] .cd p,html[data-theme="gundam"] #graded{color:#37536e}
  html[data-theme="gundam"] #navr .cta{color:#fff;background:#fb2f38}
</style>
</head>
<body>
<div id="halo"></div>
<canvas id="mglobe" title="Open the Observatory"></canvas>
<div id="nav">
  <a id="brand" href="./">BATAVIA<span> PROJECT</span></a>
  <div id="tabs">
    <a class="on" href="./">TODAY</a>
    <a href="observatory.html">OBSERVATORY</a>
    <a href="next.html">NEXT</a>
    <a href="ledger.html">LEDGER</a>
    <a href="calendar.html">CALENDAR</a>
    <a href="replay.html">REPLAY</a>
  </div>
  <div id="navr">
    <a class="ghost" href="account.html" id="loginlink">Sign in</a>
    <a class="cta" href="account.html" id="startlink">Get started</a>
    <span id="setbtn" title="Settings">⚙</span>
  </div>
</div>
<main>
  <div class="dateline">
    <b id="dl">TODAY</b>
    <span class="chip acc" id="regchip">REGIME · —</span>
  </div>

  <div id="brief" class="glass">
    <div id="brieftxt">…</div>
    <div id="states"></div>
  </div>

  <div class="sec" id="secA">ACTIVE NOW</div>
  <div class="cards" id="actives"></div>

  <div class="sec" id="secG">RECENTLY GRADED <span style="color:var(--mut);letter-spacing:0;font-weight:400" id="secGs">— reconstructed · est.</span></div>
  <div id="graded" class="glass">…</div>

  <div class="sec" id="secN">STRONGEST EDGES RIGHT NOW <span style="color:var(--mut);letter-spacing:0;font-weight:400" id="secNs">— under the live regime · est.</span></div>
  <div id="nextrows"></div>

  <div class="row2">
    <a class="btn solid" href="observatory.html" id="btnGlobe">OPEN THE GLOBE</a>
    <a class="btn line" href="policy.html" id="btnHow">HOW THIS IS GRADED</a>
  </div>
</main>
<script>
const EN=(localStorage.getItem('bp-lang')||'en')==='en';
document.documentElement.lang=EN?'en':'ko';
const $=id=>document.getElementById(id);
if(!EN){
  $('loginlink').textContent='로그인';$('startlink').textContent='시작하기';
  $('secA').textContent='지금 활성';
  $('secG').firstChild.textContent='최근 채점 ';$('secGs').textContent='— 재구성 · 추정';
  $('secN').firstChild.textContent='지금 가장 강한 우위 ';$('secNs').textContent='— 실시간 국면 조건 · 추정';
  $('btnGlobe').textContent='지구본 열기';$('btnHow').textContent='채점 방식 보기';
}
$('setbtn').addEventListener('click',()=>{
  const t=(localStorage.getItem('bp-theme')||'dark')==='dark'?'gundam':'dark';
  localStorage.setItem('bp-theme',t);location.reload();});
const NOC={cache:'no-store'};
const FAMC={'성장':'#4FD8C0','고용':'#7FD8FF','물가':'#FF5D6E','금리':'#FF8A93','유동성':'#5B8DEF',
 '포지셔닝':'#C79BFF','물리':'#D9A441','시장구조':'#A79BFF','이벤트':'#E8A33D','달러·FX':'#4FB8D8'};
const R5=[[.25,'CALM','안정'],[.38,'STEADY','평온'],[.47,'WATCH','주의'],[.55,'TENSION','긴장'],[9,'ALERT','경보']];
const EASY={CALM:['Assets are moving apart — diversification is alive','자산들이 제각각 — 분산이 살아있는 시장'],
 STEADY:['Markets are breathing normally','시장은 평소의 호흡입니다'],
 WATCH:['Connections are growing — convergence rising','연결이 늘고 있습니다 — 동조 상승'],
 TENSION:['Assets are starting to move together','자산들이 같이 움직이기 시작했습니다'],
 ALERT:['Markets are moving as one — diversification is gone','시장이 한 몸처럼 움직입니다 — 분산 소멸']};
const today=new Date();
$('dl').textContent=(EN?'TODAY — ':'오늘 — ')+today.toISOString().slice(0,10);
Promise.all([
 fetch('data/regime.json',NOC).then(r=>r.json()).catch(()=>null),
 fetch('data/event_card.json',NOC).then(r=>r.json()).catch(()=>null),
 fetch('data/news.json',NOC).then(r=>r.json()).catch(()=>({events:[]})),
 fetch('logic/ledger.json',NOC).then(r=>r.json()).catch(()=>null),
 fetch('data/backtest/scorecard.json',NOC).then(r=>r.json()).catch(()=>null),
 fetch('logic/ledger-full.json',NOC).then(r=>r.json()).catch(()=>null),
 fetch('data/backtest/calendar.json',NOC).then(r=>r.json()).catch(()=>null),
 fetch('data/backtest/fires.jsonl',NOC).then(r=>r.text()).catch(()=>'')
]).then(([rg,ev,news,led,score,full,cal,ftxt])=>{
 const conv=rg&&rg.conv?rg.conv.value:null;
 const st=conv==null?null:R5.find(r=>conv<r[0]);
 $('regchip').textContent='REGIME · '+(st?(EN?st[1]:st[2]):'—')+(conv!=null?' '+conv.toFixed(3):'');
 /* ── the one-sentence brief ── */
 const dd=ev&&ev.event&&ev.event.release_date?
   Math.max(0,Math.ceil((new Date(ev.event.release_date+'T00:00:00Z')-Date.now())/864e5)):null;
 const idx=ev&&ev.prepricing?ev.prepricing.index:null;
 const phr=idx==null?'':(idx<30?(EN?'barely priced in':'반영 미미'):idx<60?(EN?'partly priced in':'일부 반영')
   :idx<80?(EN?'largely priced in':'상당 부분 반영'):(EN?'over-pricing suspected':'과반영 의심'));
 let s1=st?(EN?EASY[st[1]][0]:EASY[st[1]][1]):'—';
 let s2='';
 const evName=(()=>{let n=ev&&ev.event?String(ev.event.name):'';
   if(EN){n=n.replace('미국 CPI','US CPI').replace(/\((\d{4})년 (\d+)월분\)/,'($1-$2 data)');}
   return n;})();
 if(ev&&ev.event&&dd!=null){
   s2=EN?` The one thing worth watching: <b>${evName} lands in ${dd} days${idx!=null?` — pre-priced ${idx}/100 (${phr})`:''}.</b>`
       :` 지켜볼 것 하나: <b>${evName}까지 ${dd}일${idx!=null?` — 선반영 ${idx}/100 (${phr})`:''}.</b>`;
 } else {
   s2=EN?' No registered event on the calendar — observation hold.':' 등록된 이벤트 없음 — 관측 유지.';
 }
 $('brieftxt').innerHTML=s1+'.'+s2;
 /* ── live activation flags (same conditions the engine judges) ── */
 const evs=(news&&news.events)||[];
 const havKm=(a,b)=>{const R=6371,d2r=Math.PI/180;
   const dLa=(b[0]-a[0])*d2r,dLo=(b[1]-a[1])*d2r;
   const x=Math.sin(dLa/2)**2+Math.cos(a[0]*d2r)*Math.cos(b[0]*d2r)*Math.sin(dLo/2)**2;
   return 2*R*Math.asin(Math.sqrt(x));};
 const CHK=led?Object.values(led.chokepoints||{}):[];
 let nearHit=0,nearEv=null,nearD=null;
 evs.forEach(e=>{if(!['18','19','20'].includes(e.code)||(e.sev||0)<4)return;
   CHK.forEach(cp=>{const d=havKm([e.la,e.lo],[cp.la,cp.lo]);
     if(d<=700){nearHit++;if(!nearEv){nearEv=e;nearD=d;}}});});
 const polHit=evs.filter(e=>['13','14'].includes(e.code)&&(e.sev||0)>=4).length;
 const nameOf=id=>{const c=full&&full.cards.find(c=>c.id===id);return c?((EN&&c.name_en)||c.name):id;};
 const badge=id=>{const c=score&&score.cards[id];if(!c)return '';
   const p=c.rate01!=null?c.rate01:c.rate,n=c.graded01||c.graded;
   return p==null?'':`${EN?'history':'역사'} n=${n} · ${Math.round(100*p)}% (±0.1% · est.)`;};
 const act=[];
 if(ev&&ev.event)act.push({id:'L-INF-001',fam:'물가',
   p:EN?`Release D-${dd} — pre-priced <b>${idx??'—'}/100</b> (${phr})`:`발표 D-${dd} — 선반영 <b>${idx??'—'}/100</b> (${phr})`});
 if(nearHit>0)act.push({id:'L-PHY-004',fam:'물리',
   p:EN?`Severity-4 event ${Math.round(nearD)} km from a gate · ${nearEv?nearEv.src:''} — 20-trading-day watch`
      :`관문 ${Math.round(nearD)}km 내 심각도4 사건 · ${nearEv?nearEv.src:''} — 20거래일 관찰`});
 if(conv!=null&&conv>=0.55)act.push({id:'L-MKT-001',fam:'시장구조',
   p:EN?`avg |ρ| ${conv.toFixed(3)} ≥ 0.55 — the whole stage moves as one`:`평균 |ρ| ${conv.toFixed(3)} ≥ 0.55 — 무대 전체가 한 몸`});
 if(polHit>0)act.push({id:'L-EVT-004',fam:'이벤트',
   p:EN?`${polHit} severity-4 political event(s) in the feed`:`심각도4 정치 사건 ${polHit}건`});
 $('secA').firstChild.textContent=(EN?'ACTIVE NOW — ':'지금 활성 — ')+act.length+(EN?' RULES':'개 규칙');
 $('actives').innerHTML=act.length?act.map(a=>
   `<div class="cd glass" style="border-left-color:${FAMC[a.fam]||'#7FD8FF'}">
      <h4>${a.id} · ${nameOf(a.id)}<span class="gr">${(full&&(full.cards.find(c=>c.id===a.id)||{}).grade)||''}</span></h4>
      <p>${a.p}</p><small>${badge(a.id)}</small></div>`).join('')
   :`<div class="cd glass" style="border-left-color:#3a4a58"><p>${EN?'Nothing active — silence is a recorded state too.':'활성 없음 — 무소식도 기록되는 상태입니다.'}</p></div>`;
 /* ── recently graded (reconstruction) ── */
 if(cal&&ftxt){
   const todayIso=new Date().toISOString().slice(0,10);
   const days=Object.keys(cal).filter(d=>d<=todayIso).sort();
   const last=days[days.length-1];
   const rows=ftxt.trim().split(/\r?\n/).map(l=>JSON.parse(l)).filter(f=>f.date===last).slice(0,3);
   $('graded').innerHTML=rows.map(f=>{
     const h=f.hit01!=null?f.hit01:f.hit;
     const v=h===true?`<span class="vd ok">✓ ${EN?'hit':'적중'}</span>`:h===false?`<span class="vd no">✗ ${EN?'miss':'빗나감'}</span>`:`<span class="vd">±</span>`;
     return `${v}<span>${f.card} ${nameOf(f.card)}${f.ret!=null?' · '+(100*f.ret).toFixed(1)+(String(f.tgt).indexOf('fred')===0?'bp':'%'):''}</span>`;
   }).join('')+`<span class="tail">${last} · ${EN?'wrong days are never deleted':'틀린 날도 지우지 않습니다'}</span>`;
 }
 /* ── strongest edges preview (same math as NEXT) ── */
 if(score){
   const hi=conv!=null&&conv>=0.55;
   const rows=Object.keys(score.cards).map(id=>{
     const c=score.cards[id];
     const base=c.rate01!=null?c.rate01:c.rate,nb=c.graded01||c.graded;
     const g=hi?c.gate.conv_hi:c.gate.conv_lo;
     const use=g&&g[0]>=10;
     return {id,p:use?g[1]/g[0]:base,n:use?g[0]:nb};
   }).filter(r=>r.p!=null&&r.n>=30)
     .sort((a,b)=>Math.abs(b.p-0.5)-Math.abs(a.p-0.5)).slice(0,3);
   $('nextrows').innerHTML=rows.map(r=>{
     const meta=(full&&full.cards.find(c=>c.id===r.id))||{};
     return `<a class="nx glass" href="next.html" style="border-left-color:${FAMC[meta.family]||'#7FD8FF'}">
       <span class="nm">${r.id} · ${nameOf(r.id)}</span>
       <small>n=${r.n} · est.</small>
       <span class="p" style="color:${r.p>=.5?'var(--up)':'var(--dn)'}">${Math.round(100*r.p)}%</span></a>`;}).join('');
 }
});
</script>
<script>
/* mini globe — canvas 2D orthographic; coastlines + live news dots; click -> observatory */
(function(){
const cv=document.getElementById('mglobe');if(!cv||!cv.getContext)return;
cv.addEventListener('click',()=>{location.href='observatory.html';});
const ctx=cv.getContext('2d');
let rings=[],dots=[];
/* geo file format: [ [[lat,lon], ...ring], ... ] (see pipeline/geo_land.py) */
fetch('data/geo/land-110m.json').then(r=>r.json()).then(t=>{
  rings=t.filter(rg=>rg.length>2)
    .map(rg=>rg.map(q=>[q[1]*Math.PI/180,q[0]*Math.PI/180]));
  draw(performance.now());
}).catch(()=>{});
fetch('data/news.json',{cache:'no-store'}).then(r=>r.json()).then(n=>{
  dots=(n.events||[]).filter(e=>(e.sev||0)>=3)
    .map(e=>({lo:e.lo*Math.PI/180,la:e.la*Math.PI/180,sev:e.sev}));
  draw(performance.now());
}).catch(()=>{});
const DPR=Math.min(2,window.devicePixelRatio||1);
function size(){const r=cv.getBoundingClientRect();
  cv.width=Math.max(2,r.width*DPR);cv.height=Math.max(2,r.height*DPR);}
size();addEventListener('resize',size);
const tilt=0.32,s0=Math.sin(tilt),c0=Math.cos(tilt);
const SPIN=matchMedia('(prefers-reduced-motion: reduce)').matches?0:(2*Math.PI/80);
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  if(t-last<50)return;last=t;
  draw(t);
}
function draw(t){
  const W=cv.width,H=cv.height;if(W<4)return;
  const R=Math.min(W,H)/2*0.86,cx=W/2,cy=H/2,lam=t/1000*SPIN;
  const acc=(getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#7FD8FF').trim();
  const g=ctx;g.clearRect(0,0,W,H);
  g.beginPath();g.arc(cx,cy,R,0,7);
  g.fillStyle=acc;g.globalAlpha=.045;g.fill();
  g.strokeStyle=acc;g.globalAlpha=.28;g.lineWidth=1*DPR;g.stroke();
  g.globalAlpha=.5;g.lineWidth=0.7*DPR;
  for(const ring of rings){
    let pen=false;g.beginPath();
    for(const pt of ring){
      const dl=pt[0]+lam,cl=Math.cos(pt[1]),sl=Math.sin(pt[1]),cd=Math.cos(dl);
      if(s0*sl+c0*cl*cd<=0.02){pen=false;continue;}
      const x=cx+R*cl*Math.sin(dl),y=cy-R*(c0*sl-s0*cl*cd);
      pen?g.lineTo(x,y):g.moveTo(x,y);pen=true;
    }
    g.stroke();
  }
  const pulse=0.6+0.4*Math.sin(t/380);
  for(const d of dots){
    const dl=d.lo+lam,cl=Math.cos(d.la),sl=Math.sin(d.la),cd=Math.cos(dl);
    if(s0*sl+c0*cl*cd<=0.05)continue;
    const x=cx+R*cl*Math.sin(dl),y=cy-R*(c0*sl-s0*cl*cd);
    g.beginPath();g.arc(x,y,(d.sev>=4?3.1:2.1)*DPR,0,7);
    g.fillStyle=d.sev>=4?'#FFB347':acc;
    g.globalAlpha=d.sev>=4?0.5+0.4*pulse:0.5;g.fill();
  }
  g.globalAlpha=1;
}
requestAnimationFrame(frame);
})();
</script>
</body>
