<!DOCTYPE html>
<html lang="ko">
<head>
<!-- STATUS: ENGINE SPIKE v4 (labs, unlinked) — BORDERS-FIRST 3D globe per owner: crisp vector country borders + labels over a muted single-tone base (WarWatch grammar, no satellite). Data colors on top. v1-v3 archived. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LABS — Borders Globe Spike</title>
<style>
  body{margin:0;background:#05070c;color:#EAF9FF;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;height:100dvh}
  #hud{position:fixed;top:10px;left:12px;z-index:5;font:12px/1.7 Consolas,monospace;color:#93a7b8;
    background:rgba(7,10,16,.72);border:1px solid rgba(159,199,224,.22);padding:8px 12px}
  #hud b{color:#CFE9F7}
  #note{position:fixed;bottom:10px;left:12px;right:12px;z-index:5;font:10px Consolas,monospace;color:#5b6b7a}
</style>
</head>
<body>
<div id="hud"><b>BORDERS GLOBE</b> · 국경 우선 3D — 경계·라벨·데이터는 벡터(무한 선명), 바탕은 무광 단색<br>
FPS <b id="fps">—</b> · 배 <b id="nships">—</b>척 · 국가 <b id="ncty">—</b> · 드래그 회전 / 휠·핀치 줌</div>
<div id="note">labs/globe-borders — 제품 아님 · 확대해서 국경 선명도 확인 · 실사/그래픽/모노판은 자료 보존</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"topojson-client":"https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as topojson from 'topojson-client';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);
camera.position.set(0,0.5,2.9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.setClearColor(0x05070c);
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.4;controls.maxDistance=5.5;controls.enablePan=false;
controls.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed=.22;

const R=1;
const D2R=Math.PI/180;
function toV3(la,lo,r){const phi=(90-la)*D2R,th=(lo+180)*D2R;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));}

/* 별 */
{const g=new THREE.BufferGeometry();const p=new Float32Array(900*3);
 for(let i=0;i<900;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(42+Math.random()*26);p.set([v.x,v.y,v.z],i*3);}
 g.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6d8296,size:.05,transparent:true,opacity:.5})));}

/* ── 바탕 구 + 국가 채움 텍스처 (채움만 래스터 — 경계는 아래 벡터) ── */
const earthMat=new THREE.MeshBasicMaterial({color:0x0c141d});
const earth=new THREE.Mesh(new THREE.SphereGeometry(R,96,96),earthMat);
scene.add(earth);

const atmMat=new THREE.ShaderMaterial({
  transparent:true,side:THREE.BackSide,depthWrite:false,
  uniforms:{c:{value:new THREE.Color(0x9fc7e0)}},
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 c;varying vec3 vN;void main(){float i=pow(.58-dot(vN,vec3(0.,0.,1.)),2.6);gl_FragColor=vec4(c,1.)*i*.7;}'});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.09,64,64),atmMat));

const COUNTRIES='https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
fetch(COUNTRIES).then(r=>r.json()).then(topo=>{
  const feats=topojson.feature(topo,topo.objects.countries).features;
  document.getElementById('ncty').textContent=feats.length;
  /* 채움: 등장방형 캔버스 → 텍스처 (나라별 미묘한 명도 차로 구분) */
  const c=document.createElement('canvas');c.width=4096;c.height=2048;
  const x=c.getContext('2d');
  x.fillStyle='#0b131c';x.fillRect(0,0,4096,2048); /* 바다 */
  const px=(lo)=> (lo+180)/360*4096, py=(la)=> (90-la)/180*2048;
  feats.forEach((f,fi)=>{
    const shade=0.85+((fi*2654435761)%1000)/1000*0.3; /* 나라별 결정적 음영 */
    const g0=Math.round(24*shade),g1=Math.round(34*shade),g2=Math.round(44*shade);
    x.fillStyle=`rgb(${g0},${g1},${g2})`;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    polys.forEach(poly=>{
      x.beginPath();
      poly.forEach(ring=>{ring.forEach((p,i)=>{i?x.lineTo(px(p[0]),py(p[1])):x.moveTo(px(p[0]),py(p[1]));});x.closePath();});
      x.fill('evenodd');});});
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  earth.material=new THREE.MeshBasicMaterial({map:t});
  /* ── 벡터 경계: 내부 국경(밝게) + 해안선(은은) — 각 1드로콜 ── */
  function meshToSegs(mesh,r){
    const verts=[];
    const lines=mesh.type==='MultiLineString'?mesh.coordinates:[mesh.coordinates];
    lines.forEach(line=>{for(let i=0;i<line.length-1;i++){
      const a=toV3(line[i][1],line[i][0],r),b=toV3(line[i+1][1],line[i+1][0],r);
      verts.push(a.x,a.y,a.z,b.x,b.y,b.z);}});
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
    return g;}
  const inner=topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b);
  earth.add(new THREE.LineSegments(meshToSegs(inner,R*1.0018),
    new THREE.LineBasicMaterial({color:0xBFD9EA,transparent:true,opacity:.55})));
  const coast=topojson.mesh(topo,topo.objects.countries,(a,b)=>a===b);
  earth.add(new THREE.LineSegments(meshToSegs(coast,R*1.0015),
    new THREE.LineBasicMaterial({color:0x9FC0D6,transparent:true,opacity:.38})));
}).catch(e=>{document.getElementById('ncty').textContent='로드 실패';});

/* ── 주요국 라벨 (빌보드 스프라이트 — 항상 카메라를 봄) ── */
const LABELS=[['UNITED STATES',39,-98],['CANADA',58,-105],['BRAZIL',-10,-52],['RUSSIA',60,95],
 ['CHINA',35,103],['INDIA',21,78],['AUSTRALIA',-25,134],['SAUDI ARABIA',24,45],
 ['KOREA',36.4,127.8],['JAPAN',37.5,138.5],['UK',54,-2],['FRANCE',47,2],['GERMANY',51,10],
 ['EGYPT',26,30],['NIGERIA',9,8],['SOUTH AFRICA',-29,25],['MEXICO',24,-102],
 ['INDONESIA',-2,118],['TURKIYE',39,35],['IRAN',32,54],['ARGENTINA',-34,-64],['KAZAKHSTAN',48,68]];
function labelSprite(txt){
  const c=document.createElement('canvas');c.width=512;c.height=96;
  const x=c.getContext('2d');
  x.font='600 40px Consolas,monospace';x.textAlign='center';x.textBaseline='middle';
  x.letterSpacing='6px';
  x.fillStyle='rgba(214,232,244,.85)';x.fillText(txt,256,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:true}));
  s.scale.set(.30,.056,1);return s;}
LABELS.forEach(([n,la,lo])=>{
  const s=labelSprite(n);s.position.copy(toV3(la,lo,R*1.012));earth.add(s);});

/* ── 색 = 데이터 ── */
const NODES={SEL:[37.5,127],TYO:[35.7,139.7],NY:[40.7,-74],LDN:[51.5,-.1],SHA:[31.2,121.5],RYD:[24.7,46.7],SIN:[1.35,103.8]};
function arc(a,b,h,color,op){
  const A=toV3(a[0],a[1],R),B=toV3(b[0],b[1],R);
  const M=A.clone().add(B).multiplyScalar(.5).normalize().multiplyScalar(R*(1+h));
  const curve=new THREE.QuadraticBezierCurve3(A.clone().multiplyScalar(1.003),M,B.clone().multiplyScalar(1.003));
  earth.add(new THREE.Mesh(new THREE.TubeGeometry(curve,56,.0035,6,false),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:op??.85})));}
arc(NODES.NY,NODES.SEL,.20,0xFF5D6E);
arc(NODES.SEL,NODES.NY,.38,0x5FD8E8);
arc(NODES.RYD,NODES.SHA,.025,0xD9A441);
arc(NODES.TYO,NODES.LDN,.28,0xA79BFF,.6);

{const geo=new THREE.SphereGeometry(.0075,10,10);
 const extra=[[22.3,114.2],[19,72.8],[50.1,8.7],[-23.5,-46.6],[-33.9,151.2],[41.9,-87.6],[48.9,2.35]];
 const all=[...Object.values(NODES),...extra];
 const im=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:0xEAF9FF}),all.length);
 const d3=new THREE.Object3D();
 all.forEach((c2,i)=>{d3.position.copy(toV3(c2[0],c2[1],R*1.003));d3.updateMatrix();im.setMatrixAt(i,d3.matrix);});
 im.instanceMatrix.needsUpdate=true;earth.add(im);}

const hull=new THREE.ConeGeometry(.0055,.018,4);hull.rotateX(Math.PI/2);
fetch('../data/ships.json').then(r=>r.json()).then(d=>{
  const fleet=d.fleet||[];
  document.getElementById('nships').textContent=fleet.length;
  [['tanker',0xFF9A5A],['cargo',0x5FD8E8],['unknown',0x8fa3b3]].forEach(([t,col])=>{
    const ships=fleet.filter(s=>s.t===t);if(!ships.length)return;
    const im=new THREE.InstancedMesh(hull,new THREE.MeshBasicMaterial({color:col}),ships.length);
    const d3=new THREE.Object3D();
    ships.forEach((s,i)=>{const p=toV3(s.la,s.lo,R*1.004);
      d3.position.copy(p);d3.lookAt(p.clone().multiplyScalar(2));
      if(s.cog!=null)d3.rotateZ(-s.cog*D2R);
      d3.updateMatrix();im.setMatrixAt(i,d3.matrix);});
    im.instanceMatrix.needsUpdate=true;earth.add(im);});
}).catch(()=>{document.getElementById('nships').textContent='0';});

const pulses=[];
fetch('../data/news.json').then(r=>r.json()).then(d=>{
  (d.events||[]).slice(0,8).forEach(e=>{
    const p=toV3(e.la,e.lo,R*1.008);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.011,.015,32),
      new THREE.MeshBasicMaterial({color:0xFF5D6E,transparent:true,side:THREE.DoubleSide}));
    ring.position.copy(p);ring.lookAt(p.clone().multiplyScalar(2));
    ring.userData={ph:Math.random()*6.28};
    earth.add(ring);pulses.push(ring);});
}).catch(()=>{});

let frames=0,fpsT=performance.now();
const fpsEl=document.getElementById('fps');
function loop(now){
  controls.update();
  pulses.forEach(rg=>{const s=1+.9*((now/1400+rg.userData.ph)%1);
    rg.scale.set(s,s,s);rg.material.opacity=Math.max(0,1.15-s*.55);});
  renderer.render(scene,camera);
  frames++;if(now-fpsT>1000){fpsEl.textContent=frames;frames=0;fpsT=now;}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
