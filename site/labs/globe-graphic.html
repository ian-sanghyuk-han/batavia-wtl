<!DOCTYPE html>
<html lang="ko">
<head>
<!-- STATUS: ENGINE SPIKE v2 (labs, unlinked) — GRAPHIC 3D globe: our land-110m data painted onto a runtime canvas texture (no external imagery), data-first palette, regime lighting. Photoreal spike kept at globe-spike.html as reference. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LABS — Graphic Globe Spike</title>
<style>
  body{margin:0;background:#02040a;color:#EAF9FF;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;height:100dvh}
  #hud{position:fixed;top:10px;left:12px;z-index:5;font:12px/1.7 Consolas,monospace;color:#7fa9c0;
    background:rgba(5,11,17,.7);border:1px solid rgba(127,216,255,.2);padding:8px 12px}
  #hud b{color:#7FD8FF}
  #regime{position:fixed;top:10px;right:12px;z-index:5;display:flex;gap:6px}
  #regime button{font:11px Consolas,monospace;color:#7fa9c0;background:rgba(5,11,17,.7);
    border:1px solid rgba(127,216,255,.25);padding:7px 12px;cursor:pointer}
  #regime button.on{color:#02040a;background:#7FD8FF}
  #note{position:fixed;bottom:10px;left:12px;right:12px;z-index:5;font:10px Consolas,monospace;color:#4f6b78}
</style>
</head>
<body>
<div id="hud"><b>GRAPHIC GLOBE</b> · 데이터 우선 3D — 표면은 우리 해안선 데이터로 직접 그림 (외부 이미지 0)<br>
FPS <b id="fps">—</b> · 배 <b id="nships">—</b>척 · 드래그 회전 / 휠·핀치 줌</div>
<div id="regime">
  <button data-r="steady" class="on">STEADY</button>
  <button data-r="swell">SWELL</button>
  <button data-r="storm">STORM</button>
</div>
<div id="note">labs/globe-graphic — 제품 아님 · 엔진 검증 v2 · 실사판은 globe-spike.html에 자료 보존</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(0,0.55,3.05);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.55;controls.maxDistance=6;controls.enablePan=false;
controls.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed=.25;

/* 별 */
const starGeo=new THREE.BufferGeometry();
const starPos=new Float32Array(1100*3);
for(let i=0;i<1100;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(40+Math.random()*30);
  starPos.set([v.x,v.y,v.z],i*3);}
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x8fb0c8,size:.055,transparent:true,opacity:.65})));

/* ── 표면 텍스처: land-110m 데이터를 직접 그린다 ── */
const PAL={
  steady:{oceanA:'#0d1f2e',oceanB:'#050b11',land:'#12283a',coast:'#7FD8FF',chrome:0x7FD8FF,
          key:0xdff2ff,amb:0x1e3a52,atm:0x7FD8FF,bg:0x02040a},
  swell: {oceanA:'#241b0b',oceanB:'#0b0703',land:'#33260f',coast:'#E8A33D',chrome:0xE8A33D,
          key:0xffe0b0,amb:0x4a3517,atm:0xE8A33D,bg:0x070502},
  storm: {oceanA:'#2a0e13',oceanB:'#0c0405',land:'#361318',coast:'#FF6A6E',chrome:0xFF6A6E,
          key:0xffc9c9,amb:0x4e1a20,atm:0xFF6A6E,bg:0x0a0304}};
let rings=null;
const texCache={};
function makeTexture(r){
  if(texCache[r])return texCache[r];
  const P=PAL[r];
  const c=document.createElement('canvas');c.width=2048;c.height=1024;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,1024);
  g.addColorStop(0,P.oceanA);g.addColorStop(1,P.oceanB);
  x.fillStyle=g;x.fillRect(0,0,2048,1024);
  if(rings){
    x.lineJoin='round';
    rings.forEach(ring=>{
      let mn=999,mx=-999;ring.forEach(p=>{mn=Math.min(mn,p[1]);mx=Math.max(mx,p[1]);});
      x.beginPath();
      ring.forEach((p,i)=>{const px=(p[1]+180)/360*2048,py=(90-p[0])/180*1024;
        i?x.lineTo(px,py):x.moveTo(px,py);});
      x.closePath();
      x.fillStyle=P.land;x.fill();
      x.strokeStyle=P.coast;x.globalAlpha=.55;x.lineWidth=1.3;x.stroke();x.globalAlpha=1;});
    /* 남극 극점 캡 보정 */
    x.fillStyle=P.land;x.fillRect(0,1024*(90+78)/180,2048,1024);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  texCache[r]=t;return t;}

const R=1;
const D2R=Math.PI/180;
function toV3(la,lo,r){const phi=(90-la)*D2R,th=(lo+180)*D2R;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(th),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(th));}
const earthMat=new THREE.MeshPhongMaterial({shininess:6});
const earth=new THREE.Mesh(new THREE.SphereGeometry(R,96,96),earthMat);
scene.add(earth);

/* 격자 — 3D 홀로 그리드 */
const gratMat=new THREE.LineBasicMaterial({color:0x7FD8FF,transparent:true,opacity:.10});
const gratGrp=new THREE.Group();
for(let la=-60;la<=60;la+=15){
  const pts=[];for(let lo=-180;lo<=180;lo+=4)pts.push(toV3(la,lo,R*1.001));
  gratGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gratMat));}
for(let lo=-180;lo<180;lo+=15){
  const pts=[];for(let la=-88;la<=88;la+=4)pts.push(toV3(la,lo,R*1.001));
  gratGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gratMat));}
earth.add(gratGrp);

/* 대기 프레넬 */
const atmMat=new THREE.ShaderMaterial({
  transparent:true,side:THREE.BackSide,depthWrite:false,
  uniforms:{c:{value:new THREE.Color(0x7FD8FF)}},
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 c;varying vec3 vN;void main(){float i=pow(.6-dot(vN,vec3(0.,0.,1.)),2.4);gl_FragColor=vec4(c,1.)*i;}'});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.11,64,64),atmMat));

/* 조명 */
const key=new THREE.DirectionalLight(0xdff2ff,1.9);key.position.set(-2,1.2,1.6);scene.add(key);
const amb=new THREE.AmbientLight(0x1e3a52,1.1);scene.add(amb);
function setRegime(r){const P=PAL[r];
  earthMat.map=makeTexture(r);earthMat.needsUpdate=true;
  key.color.set(P.key);amb.color.set(P.amb);
  atmMat.uniforms.c.value.set(P.atm);gratMat.color.set(P.chrome);
  renderer.setClearColor(P.bg);
  document.querySelectorAll('#regime button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));}
document.querySelectorAll('#regime button').forEach(b=>b.onclick=()=>setRegime(b.dataset.r));

/* 도시 노드 */
const CITIES=[[37.5,127],[35.7,139.7],[40.7,-74],[51.5,-.1],[31.2,121.5],[24.7,46.7],[1.35,103.8],
  [22.3,114.2],[19,72.8],[50.1,8.7],[-23.5,-46.6],[-33.9,151.2],[41.9,-87.6],[48.9,2.35]];
const nodeGeo=new THREE.SphereGeometry(.008,10,10);
const nodeMat=new THREE.MeshBasicMaterial({color:0xBFE4FF});
const nodeIM=new THREE.InstancedMesh(nodeGeo,nodeMat,CITIES.length);
{const d=new THREE.Object3D();
 CITIES.forEach((c,i)=>{d.position.copy(toV3(c[0],c[1],R*1.004));d.updateMatrix();nodeIM.setMatrixAt(i,d.matrix);});
 nodeIM.instanceMatrix.needsUpdate=true;}
earth.add(nodeIM);

/* 계열 아크 — 성질 = 형태 (기존 색 체계) */
const NODES={SEL:[37.5,127],TYO:[35.7,139.7],NY:[40.7,-74],LDN:[51.5,-.1],SHA:[31.2,121.5],RYD:[24.7,46.7],SIN:[1.35,103.8]};
function arc(a,b,h,color,op){
  const A=toV3(a[0],a[1],R),B=toV3(b[0],b[1],R);
  const M=A.clone().add(B).multiplyScalar(.5).normalize().multiplyScalar(R*(1+h));
  const curve=new THREE.QuadraticBezierCurve3(A.clone().multiplyScalar(1.004),M,B.clone().multiplyScalar(1.004));
  const m=new THREE.Mesh(new THREE.TubeGeometry(curve,48,.004,6,false),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:op??.8}));
  earth.add(m);}
arc(NODES.NY,NODES.SEL,.22,0xFF5D6E);
arc(NODES.SEL,NODES.NY,.42,0x5FD8E8);
arc(NODES.RYD,NODES.SHA,.03,0xD9A441);
arc(NODES.TYO,NODES.LDN,.30,0xA79BFF,.55);

/* 실함대 */
const hull=new THREE.ConeGeometry(.006,.02,4);hull.rotateX(Math.PI/2);
fetch('../data/ships.json').then(r=>r.json()).then(d=>{
  const fleet=d.fleet||[];
  document.getElementById('nships').textContent=fleet.length;
  [['tanker',0xFF9A5A],['cargo',0x5FD8E8],['unknown',0x5d7385]].forEach(([t,col])=>{
    const ships=fleet.filter(s=>s.t===t);if(!ships.length)return;
    const im=new THREE.InstancedMesh(hull,new THREE.MeshBasicMaterial({color:col}),ships.length);
    const d3=new THREE.Object3D();
    ships.forEach((s,i)=>{const p=toV3(s.la,s.lo,R*1.006);
      d3.position.copy(p);d3.lookAt(p.clone().multiplyScalar(2));
      if(s.cog!=null)d3.rotateZ(-s.cog*D2R);
      d3.updateMatrix();im.setMatrixAt(i,d3.matrix);});
    im.instanceMatrix.needsUpdate=true;earth.add(im);});
}).catch(()=>{document.getElementById('nships').textContent='0';});

/* 실뉴스 펄스 */
const pulses=[];
fetch('../data/news.json').then(r=>r.json()).then(d=>{
  (d.events||[]).slice(0,8).forEach(e=>{
    const p=toV3(e.la,e.lo,R*1.01);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.012,.016,32),
      new THREE.MeshBasicMaterial({color:0xFF5D6E,transparent:true,side:THREE.DoubleSide}));
    ring.position.copy(p);ring.lookAt(p.clone().multiplyScalar(2));
    ring.userData={ph:Math.random()*6.28};
    earth.add(ring);pulses.push(ring);});
}).catch(()=>{});

/* 데이터 로드 후 텍스처 */
fetch('../data/geo/land-110m.json').then(r=>r.json()).then(d=>{rings=d;texCache.steady=null;setRegime('steady');});
setRegime('steady');

let frames=0,fpsT=performance.now();
const fpsEl=document.getElementById('fps');
function loop(now){
  controls.update();
  pulses.forEach(rg=>{const s=1+.9*((now/1400+rg.userData.ph)%1);
    rg.scale.set(s,s,s);rg.material.opacity=Math.max(0,1.15-s*.55);});
  renderer.render(scene,camera);
  frames++;if(now-fpsT>1000){fpsEl.textContent=frames;frames=0;fpsT=now;}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
