<!DOCTYPE html>
<html lang="ko">
<head>
<!-- STATUS: ACCOUNT / SIGN-UP v0 DRAFT — UI only, no backend, form disabled.
     Real accounts require an auth backend decision (P5) and precede payments. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BATAVIA PROJECT — Account</title>
<style>
  :root{--acc:#7FD8FF;--ink:#EAF9FF;--dim:#93a7b8;--mut:#5b6b7a;
    --glass:rgba(7,11,17,.60);--edge:rgba(159,199,224,.20)}
  *{box-sizing:border-box}
  body{margin:0;background:#05070c;color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;flex-direction:column;min-height:100vh}
  .glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(9px);border-radius:11px}
  header{padding:18px;max-width:760px;margin:0 auto;width:100%}
  header b{font:600 14px Consolas,monospace;letter-spacing:3px}
  header a{color:var(--acc);text-decoration:none;font:10px Consolas,monospace;float:right;margin-top:4px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}
  #card{width:min(400px,92vw);padding:26px 26px 22px}
  h1{margin:0 0 4px;font:600 15px Consolas,monospace;letter-spacing:2px}
  .sub{font-size:12px;color:var(--dim);margin-bottom:18px;line-height:1.7}
  label{display:block;font:10px Consolas,monospace;color:var(--mut);letter-spacing:1px;margin:12px 0 5px}
  input{width:100%;background:rgba(7,11,17,.6);border:1px solid var(--edge);border-radius:9px;
    color:var(--ink);font:13px 'Segoe UI';padding:11px 13px;outline:none;opacity:.55}
  #cta{width:100%;margin-top:18px;padding:12px;border-radius:9px;border:1px dashed var(--edge);
    background:none;color:var(--mut);font:600 12px Consolas,monospace;letter-spacing:2px;cursor:not-allowed}
  .foot{margin-top:14px;font-size:11px;color:var(--mut);line-height:1.7;text-align:center}
  .foot a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<header><a href="./">← OBSERVATORY</a><b>BATAVIA PROJECT</b></header>
<main>
  <div id="card" class="glass">
    <h1>관측소 계정</h1>
    <div class="sub">이메일 가입에 더해 <b>구글 계정으로 한 번에</b> 시작할 수도 있게 준비 중입니다.
    지금은 계정 없이도 관측소의 모든 무료 기능을 쓸 수 있습니다.</div>
    <label>EMAIL</label>
    <input type="email" placeholder="you@example.com" disabled>
    <label>PASSWORD</label>
    <input type="password" placeholder="········" disabled>
    <button id="cta2" disabled style="width:100%;margin-top:14px;padding:12px;border-radius:9px;border:1px dashed var(--edge);background:none;color:var(--mut);font:600 12px Consolas,monospace;letter-spacing:2px;cursor:not-allowed">이메일로 가입 — 준비 중</button>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0 2px">
      <span style="flex:1;height:1px;background:var(--edge)"></span>
      <span style="font:10px Consolas,monospace;color:var(--mut)">또는</span>
      <span style="flex:1;height:1px;background:var(--edge)"></span>
    </div>
    <button id="cta" disabled style="display:flex;align-items:center;justify-content:center;gap:10px">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.4-4.1 7.2-10.1 7.2-17.5z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.2 0 11.7-2 15.6-5.6l-7.4-5.8c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4-13.5-9.5l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      Google로 계속하기 — 연동 준비 중
    </button>
    <div class="foot">
      오픈 시 <a href="pricing.html">구독 안내</a> · <a href="policy.html">데이터와 원칙</a> ·
      <a href="refund.html">환불 정책</a>이 함께 적용됩니다
    </div>
  </div>
</main>
<script>
(function(){
const L=localStorage.getItem('bp-lang')||'en';
document.documentElement.lang=L;
if(L!=='en')return;
document.querySelector('#card h1').textContent='Observatory account';
document.querySelector('#card .sub').innerHTML='Alongside email sign-up, <b>one-tap Google sign-in</b> is in preparation. Every free feature of the Observatory works without an account for now.';
document.getElementById('cta2').textContent='Sign up with email — in preparation';
document.querySelectorAll('#card span').forEach(s=>{if(s.textContent.trim()==='또는')s.textContent='or';});
var g=document.getElementById('cta');g.lastChild.textContent=' Continue with Google — in preparation';
document.querySelector('.foot').innerHTML='At open, the <a href="pricing.html">pricing</a> · <a href="policy.html">data &amp; principles</a> · <a href="refund.html">refund policy</a> apply together';
})();
</script>
</body>
</html>
