name: GDELT news pipeline

on:
  schedule:
    - cron: '*/15 * * * *'   # GDELT publishes every 15 min
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pipeline (stdlib only)
        run: python pipeline/gdelt_news.py
          python pipeline/conflict_intensity.py
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "batavia-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/news.json site/data/conflicts-auto.json site/data/history/conflict_days.json
          if git diff --cached --quiet; then echo "no change"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: news.json 갱신 (GDELT 15-min)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy site (robot pushes do not trigger pages.yml)
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
