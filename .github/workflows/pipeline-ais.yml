name: AIS chokepoint snapshot

on:
  schedule:
    - cron: '7 */2 * * *'   # 2시간 주기 — 무료 수신망 fair-use 배려 (실시간은 PRO 몫)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Snapshot (no-op until AISSTREAM_KEY secret exists)
        run: python pipeline/ais_snapshot.py
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "batavia-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/ships.json pipeline/ais_registry.json || true
          if git diff --cached --quiet; then echo "no change"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: ships.json 갱신 (AIS snapshot)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy site (robot pushes do not trigger pages.yml)
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
