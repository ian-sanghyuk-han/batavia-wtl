name: AIS chokepoint snapshot

on:
  schedule:
    - cron: '7 * * * *'   # hourly — FREE tier is delayed by design; realtime = PRO later
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - name: Snapshot (no-op until AISSTREAM_KEY secret exists)
        run: python pipeline/ais_snapshot.py
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "batavia-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/ships.json || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: ships.json 갱신 (AIS snapshot)"
          git pull --rebase
          git push
