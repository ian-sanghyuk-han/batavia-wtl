name: EXP-004 fill price cache

# KRX blocks bursty clients at the IP level, and the block outlives the run that earned
# it. So this fetches a bounded slice per run, saves what it got, and resumes next time.
# Run it repeatedly with gaps between until 'remaining' reaches zero.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max tickers to fetch this run'
        required: false
        default: '600'
      sleep:
        description: 'Seconds between requests (raise if blocked)'
        required: false
        default: '1.5'
      status_only:
        description: 'Only report how full the cache is'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: exp004-fetch          # never let two fetches hammer KRX at once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/review-and-proceed-rir7n2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r lab/exp004/requirements.txt finance-datareader

      # restore-keys lets each run pick up the newest previous cache; the unique primary
      # key means every run saves a fresh entry rather than fighting over one immutable
      # key (GitHub Actions caches cannot be overwritten).
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: lab/exp004/data/ohlcv
          key: exp004-ohlcv-${{ github.run_id }}
          restore-keys: |
            exp004-ohlcv-

      - name: Fetch a slice
        if: inputs.status_only != 'true'
        run: |
          cd lab/exp004
          python fetch_cache.py --limit ${{ inputs.limit || 600 }} \
                                --sleep ${{ inputs.sleep || 1.5 }} \
                                ${{ inputs.refresh_universe == 'true' && '--refresh-universe' || '' }}

      - name: Cache status
        if: always()
        run: cd lab/exp004 && python fetch_cache.py --status

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lab/exp004/data/ohlcv
          key: exp004-ohlcv-${{ github.run_id }}
