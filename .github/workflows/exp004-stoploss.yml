name: EXP-004 stop-loss ladder

# What a floor under the deep-dip RSI recovery rule costs. The rule's worst trade so far
# came back at -99.8%; this measures every stop level side by side, together with the
# counterfactual that decides whether the insurance is worth its premium — for each trade
# a stop closed, what the identical un-stopped trade went on to do.
# Reads the cached bars only; never contacts the venue.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Number of stocks (0 = whole universe)'
        required: false
        default: '0'

permissions:
  contents: write

# Two runs write the same output files; queue them rather than race at the commit step.
concurrency:
  group: exp004-stoploss
  cancel-in-progress: false

jobs:
  stoploss:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/review-and-proceed-rir7n2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r lab/exp004/requirements.txt finance-datareader

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: lab/exp004/data
          key: exp004-ohlcv-
          restore-keys: |
            exp004-ohlcv-

      - name: Unit tests must pass before any real-data run
        run: cd lab/exp004 && python -m pytest tests/ -q

      - name: Stop-loss ladder
        run: |
          cd lab/exp004
          python run_stoploss.py --tickers ${{ inputs.tickers || 0 }} --outdir output/stoploss

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp004-stoploss
          path: lab/exp004/output/stoploss/
          retention-days: 30

      - name: Commit
        if: always()
        run: |
          git config user.name "batavia-pipeline"
          git config user.email "actions@users.noreply.github.com"
          BR=claude/review-and-proceed-rir7n2
          # Generated files: whatever this run produced is the version to keep. Rebasing
          # them against another run's output only produces conflicts in data nobody edits
          # by hand, so the remote is taken as the base and the fresh output goes on top.
          git fetch origin "$BR"
          git reset --mixed "origin/$BR"
          git add -f lab/exp004/output/stoploss || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "lab: EXP-004 stop-loss ladder result"
          git push origin "HEAD:$BR"
